<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e4a32">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>案件管理・帳票作成ツール</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Meiryo','Hiragino Sans','Yu Gothic',sans-serif;background:#f5f5f5;color:#222;font-size:13px}
.app{display:grid;grid-template-columns:200px 1fr;height:100vh}
.sb{background:#fff;border-right:1px solid #e0e0e0;padding:16px;display:flex;flex-direction:column;gap:20px;overflow-y:auto}
.sb-lbl{font-size:10px;font-weight:600;color:#888;letter-spacing:.1em;margin-bottom:8px}
.doc-btn{display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:transparent;cursor:pointer;border-radius:6px;font-size:12px;color:#555;transition:.15s;border:1px solid transparent}
.doc-btn:hover{background:#eef5f0;color:#1e4a32}
.doc-btn.active{background:#1e4a32;color:#fff;font-weight:600}
.doc-sub{font-size:10px;opacity:.7;display:block;margin-top:1px}
.toggle2{display:flex;border:1px solid #ddd;border-radius:6px;overflow:hidden}
.t2-btn{flex:1;padding:6px 4px;font-size:12px;border:none;background:transparent;cursor:pointer;color:#666;transition:.15s}
.t2-btn.active{background:#1e4a32;color:#fff}
.pat-btns{display:flex;gap:6px}
.pat-btn{width:36px;height:36px;border:1px solid #ddd;border-radius:6px;font-size:15px;background:transparent;cursor:pointer;color:#666;transition:.15s}
.pat-btn.active{background:#1e4a32;color:#fff;border-color:#1e4a32}
.main-area{display:flex;flex-direction:column;overflow:hidden}
.main-tabs{display:flex;background:#fff;border-bottom:1px solid #e0e0e0;padding:0 16px;align-items:center;gap:4px;flex-shrink:0}
.doc-badge{font-size:11px;padding:3px 10px;background:#e6f0e9;color:#1e4a32;border-radius:999px;margin-right:8px;font-weight:600}
.m-tab{padding:12px 14px;font-size:13px;border:none;background:transparent;cursor:pointer;color:#888;border-bottom:2px solid transparent;transition:.15s}
.m-tab.active{color:#1e4a32;border-bottom-color:#1e4a32;font-weight:600}
.main-content{flex:1;overflow-y:auto}
.form-panel{padding:16px}
.sec-title{font-size:11px;font-weight:600;color:#888;margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid #eee;letter-spacing:.05em}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:#666}
.field input,.field select,.field textarea{width:100%;font-size:12px;padding:6px 8px;border:1px solid #ddd;border-radius:5px;outline:none;transition:.15s;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#1e4a32}
.field textarea{height:56px;resize:vertical}
.field.full{grid-column:1/-1}
.line-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:8px}
.line-tbl th{font-size:10px;color:#666;font-weight:600;padding:5px 5px;border-bottom:1px solid #eee;text-align:left}
.line-tbl td{padding:3px 3px;vertical-align:middle}
.line-tbl td input{font-size:12px;padding:4px 6px;border:1px solid #ddd;border-radius:4px;width:100%;font-family:inherit}
.line-tbl td input:focus{outline:none;border-color:#1e4a32}
.neg-row td,.neg-row td input{color:#c0392b!important;font-weight:600}
.btn{padding:6px 14px;font-size:12px;border-radius:6px;cursor:pointer;border:1px solid #ddd;background:#fff;color:#333;transition:.15s;font-family:inherit}
.btn:hover{background:#f5f5f5}
.btn.primary{background:#1e4a32;color:#fff;border-color:#1e4a32;font-weight:600}
.btn.primary:hover{background:#163a27}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.del{color:#c0392b;border-color:#e0b0aa}
.ldrag{cursor:grab;color:#aaa;text-align:center;font-size:15px;user-select:none;padding:0 2px!important}
.ldrag:hover{color:#1e4a32}
.btn.lmv{padding:2px 5px;font-size:10px;color:#666;margin-right:1px}
.btn.lmv:disabled{opacity:.3;cursor:default}
.line-row.dragging{opacity:.4}
.line-row.drop-above td{box-shadow:inset 0 2px 0 #1e4a32}
.line-row.drop-below td{box-shadow:inset 0 -2px 0 #1e4a32}
.line-row.moved td{background:#e6f0e9;transition:background .6s}
.btn.del:hover{background:#fff5f5}
.bar{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #e0e0e0;background:#fff;align-items:center;flex-shrink:0}
.bar-note{font-size:11px;color:#aaa;margin-left:auto}
/* Preview wrapper */
.prev-wrap{padding:20px;background:#e8e8e8;min-height:100%}
/* ---- スマホ・タブレット ---- */
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
  .sb,.main-area,.sb-menu,.main-content{min-width:0}
  .sb{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 10px;border-right:none;border-bottom:1px solid #e0e0e0;overflow:visible}
  .sb .sb-lbl{display:none}
  .sb-menu{display:flex;gap:4px;overflow-x:auto;width:100%;order:3}
  .sb-menu .doc-btn{white-space:nowrap;width:auto;margin:0;padding:6px 10px;font-size:12px}
  .sb-data{margin:0 0 0 auto!important;order:2}
  .sb-data #sh-status{margin:0!important}
  .sb-data #sh-status>div,.sb-data #sh-status>a,.sb-data>.btn,.sb-data>label{display:none!important}
  .sb-data #sh-status button{width:auto!important;margin:0!important;padding:4px 10px}
  .main-tabs{padding:0 8px;overflow-x:auto;flex-wrap:nowrap}
  .main-tabs .toggle2{width:100px!important}
  .form-panel{padding:10px}
  .form-grid{grid-template-columns:1fr}
  .bar{flex-wrap:wrap;padding:8px}
  .bar .btn{flex:1 1 auto;font-size:12px;padding:8px 6px}
  .bar-note{display:none}
  #panel-dash,#panel-proj,#panel-issued,#panel-received,#panel-master{padding:10px!important}
  #pj-detail [style*="grid-template-columns:repeat(4"]{grid-template-columns:1fr 1fr!important}
  .line-tbl{display:block;overflow-x:auto;white-space:nowrap}
  .prev-wrap{padding:8px;overflow-x:auto}
}
/* Pattern 1 - 明朝体・クラシック */
.doc-p1{background:white;color:#1a1a1a;padding:15mm 18mm;font-family:'Zen Old Mincho','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','MS PMincho',serif;font-size:11.5px;line-height:1.75;width:210mm;min-height:297mm;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.15)}
/* Pattern 2 - ゴシック体・モダン */
.doc-p2{background:white;color:#1a1a1a;padding:15mm 18mm;font-family:'Zen Old Mincho','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','MS PMincho',serif;font-size:11.5px;line-height:1.7;width:210mm;min-height:297mm;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.15)}

/* 見積書（A4横） */
</style>
<style id="land-css">
.doc-land{background:white;color:#111;width:297mm;height:210mm;padding:12mm 20mm 10mm;margin:0 auto 16px;box-shadow:0 2px 12px rgba(0,0,0,.15);font-family:'Zen Old Mincho','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif JP','Noto Serif CJK JP','MS PMincho',serif;font-size:14px;line-height:1.5;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.doc-land:last-child{page-break-after:auto;break-after:auto}
.land-title{text-align:center;font-weight:900;font-size:30px;letter-spacing:.3em;padding-left:.3em;color:#1e4a32}
.land-tbl{width:100%;border-collapse:collapse;font-size:12px}
.land-tbl th{background:#1e4a32;color:#fff;font-weight:700;padding:6px;border:1px solid #1e4a32}
.land-tbl td{border-bottom:0.5px solid #ccc;padding:5px 8px;height:26px}
.land-tbl tbody tr td:first-child{border-left:1px solid #1e4a32}
.land-tbl tbody tr td:last-child{border-right:1px solid #1e4a32}
</style>
<style>
/* Print */
@media print{
  body{background:white}
  .app{display:block;height:auto}
  .sb,.main-tabs,.bar{display:none!important}
  .main-content{overflow:visible}
  .prev-wrap{padding:0;background:white}
  .doc-p1,.doc-p2{box-shadow:none;margin:0;padding:15mm 18mm;width:210mm;min-height:297mm}
  #panel-form{display:none!important}
  #panel-preview{display:block!important}
  @page{size:A4;margin:0}
}
.staff-chip{display:inline-block;font-size:11.5px;padding:1px 9px;border-radius:999px;background:#e6f0e9;color:#1e4a32;border:1px solid #c9dccf;white-space:nowrap;margin:1px 0}
.no-staff{display:inline-block;font-size:11px;padding:1px 8px;border-radius:999px;background:#fdecea;color:#c0392b;border:1px solid #f3c2bc;font-weight:700;white-space:nowrap}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.dgrid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dcard{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px 14px;min-width:0}
.dcard-t{font-size:11px;color:#666;font-weight:600}
.dcard-v{font-size:22px;font-weight:700;margin:4px 0 2px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard-s{font-size:11px;color:#888}
.dwarn{display:inline-block;margin-top:4px;font-size:10.5px;color:#c0392b;font-weight:700}
.dbox{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px 14px;min-width:0;overflow:auto}
.dbox-t{font-size:12px;color:#444;font-weight:700;margin-bottom:6px}
@media (max-width:1000px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:480px){.dcard-v{font-size:18px}}
</style>
</head>
<body>
<div class="app">
<!-- Sidebar（メニュー） -->
<div class="sb">
  <div>
    <div id="sb-brand" style="font-weight:700;font-size:14px;color:#1e4a32;line-height:1.4;margin-bottom:2px"></div>
    <div style="font-size:10px;color:#aaa;letter-spacing:.05em">案件管理・帳票作成ツール <span id="app-ver"></span></div>
  </div>
  <div class="sb-menu">
    <div class="sb-lbl">メニュー</div>
    <button class="doc-btn" id="nav-dash" onclick="setMainTab('dash')">📊 ダッシュボード</button>
    <button class="doc-btn" id="nav-proj" onclick="setMainTab('proj')">📁 案件</button>
    <button class="doc-btn" id="nav-issued" onclick="setMainTab('issued')">📤 発行請求書一覧</button>
    <button class="doc-btn" id="nav-received" onclick="setMainTab('received')">📥 受領請求書一覧</button>
    <button class="doc-btn" id="nav-master" onclick="setMainTab('master')">⚙ マスタ登録</button>
  </div>
  <div class="sb-data" style="margin-top:auto">
    <div class="sb-lbl">データ</div>
    <div id="sh-status" style="margin-bottom:10px"></div>
    <button class="btn" style="width:100%;font-size:11px" onclick="exportAll()" title="案件・顧客・自社情報をファイルに保存">⬇ バックアップ</button>
    <label class="btn" style="display:block;text-align:center;width:100%;font-size:11px;margin-top:6px;cursor:pointer" title="バックアップファイルから復元">⬆ 復元<input type="file" accept=".json" style="display:none" onchange="importAll(this)"/></label>
  </div>
</div>

<!-- Main -->
<div class="main-area">
  <div id="ver-banner" style="display:none;align-items:center;gap:10px;background:#fdf1e0;border-bottom:1px solid #f0d9b5;padding:8px 16px;font-size:12.5px;color:#7a4a00">
    🔄 ツールが新しい版に更新されています。保存してから、ページを再読み込みしてください。
    <button class="btn sm" style="margin-left:auto" onclick="location.reload()">再読み込み</button>
  </div>
  <div class="main-tabs" id="editor-tabs">
    <button class="btn sm" id="back-btn" onclick="backFromEditor()" style="margin-right:6px">← 案件に戻る</button>
    <span class="doc-badge" id="doc-badge"></span>
    <button class="m-tab active" id="mtab-form" onclick="setMainTab('form')">入力</button>
    <button class="m-tab" id="mtab-prev" onclick="setMainTab('preview')">プレビュー</button>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;color:#888">消費税</span>
      <div class="toggle2" style="width:120px">
        <button class="t2-btn active" id="tax-inc" onclick="setTax('inc')">税込</button>
        <button class="t2-btn" id="tax-exc" onclick="setTax('exc')">税抜</button>
      </div>
    </div>
  </div>
  <div class="main-content">
    <div id="panel-dash" style="display:none;padding:16px"></div>
    <div id="panel-proj" style="display:none;padding:16px"></div>
    <div id="panel-issued" style="display:none;padding:16px"></div>
    <div id="panel-received" style="display:none;padding:16px"></div>
    <div id="panel-master" style="display:none;padding:16px"></div>
    <div id="panel-form" class="form-panel" style="display:none"></div>
    <div id="panel-preview" style="display:none" class="prev-wrap"></div>
  </div>
  <div class="bar" id="main-bar">
    <button class="btn primary" onclick="renderPreview();setMainTab('preview')">プレビュー更新 →</button>
    <button class="btn" onclick="doPrint()">🖨 印刷 / PDF保存</button>
    <button class="btn" onclick="confirmIssue()" style="color:#27ae60;border-color:#9fd8b5;font-weight:600">✓ 発行確定</button>
    <button class="btn" onclick="saveDraft()">💾 保存</button>
    <button class="btn" id="est2inv-btn" onclick="createInvoiceFromEstimate(S.projectId)" style="display:none;color:#1e4a32;border-color:#1e4a32;font-weight:600">→ この見積から請求書を作成</button>
    <button class="btn" onclick="confirmReset()" style="color:#c0392b;border-color:#e0b0aa">🗑 新規作成</button>
    <span id="autosave-note" style="font-size:11px;color:#1e4a32;margin-left:auto;white-space:nowrap"></span>
    <span class="bar-note" style="margin-left:12px">印刷後は「✓ 発行確定」で連番が進みます</span>
  </div>
</div>
</div>

<div id="imp-modal"></div>
<script>
// 画像データ（ロゴ・角印）
const LOGO_IMG='';
const STAMP_IMG='';

const DOCS = [
  {id:'invoice',  label:'請求書',     prefix:'INV', hasLines:true,  hasTotal:true,  hasDue:true,    hasDelDate:false, hasBank:true,  hasButashi:false, hasPayDate:false},
  {id:'estimate', label:'見積書',   prefix:'EST', hasLines:true,  hasTotal:true,  hasDue:true,    hasDelDate:false, hasBank:false, hasButashi:false, hasPayDate:false},
  {id:'receipt',  label:'領収書',     prefix:'REC', hasLines:true,  hasTotal:true,  hasDue:false,   hasDelDate:false, hasBank:false, hasButashi:true,  hasPayDate:false},
  {id:'delivery', label:'納品書',     prefix:'DEL', hasLines:true,  hasTotal:false, hasDue:false,   hasDelDate:true,  hasBank:false, hasButashi:false, hasPayDate:false},
  {id:'order',    label:'発注書',     prefix:'ORD', hasLines:true,  hasTotal:true,  hasDue:false,   hasDelDate:true,  hasBank:false, hasButashi:false, hasPayDate:false},
  {id:'payment',  label:'支払通知書', prefix:'PAY', hasLines:true,  hasTotal:true,  hasDue:false,   hasDelDate:false, hasBank:false, hasButashi:false, hasPayDate:true}
];

let S = {docType:'invoice', taxType:'inc', pattern:3, taxRate:10, mainTab:'form', projectId:null};

// ===================== 発行者（自社）設定 =====================
// 会社を変えるときはここだけ書き換える
const ISSUER = {
  name:'匠技建株式会社',
  zip:'〒825-0005',
  addr:'福岡県田川市大字糒2373－44', // 全角スペースの位置で改行
  tel:'0947-46-2280',
  fax:'0947-85-8229',           // 空なら非表示
  reg:'T1290801021058',         // 登録番号（インボイス）
  // 請求書の振込先（1要素＝1行）。空配列なら振込先欄ごと非表示
  bankLines:[],
  // 請求書下部の注意書き（{text, color} の配列）
  invoiceNotes:[
    {text:'※ 内容明細ご確認後、上記の口座にお振込みをお願いいたします。'},
    {text:'※ 恐れ入りますが、お振込み手数料はご負担いただきますようお願いいたします。'}
  ],
  logo:LOGO_IMG,                // ロゴ画像（data URL）。空なら非表示
  logoStyle:'',  // ロゴの位置・サイズ微調整（CSS）
  stamp:STAMP_IMG               // 角印画像（data URL）。空なら非表示
};
// =============================================================

// 書類ごとのフォームデータを保持
const docForms = {};

function defaultF(){
  return {
    no:'', date:todayStr(), dueDate:nextMonthEnd(), deliveryDate:todayStr(),
    client:'', clientTitle:'御中', clientAddr:'', dept:'', contactName:'', site:'',
    butashi:'', receiptAmt:'0',
    note:'', subject:'', lines:[{desc:'',qty:'',unit:'',unitPrice:'',memo:''}]
  };
}

let F = defaultF();

// ローカル時刻（日本時間）で YYYY-MM-DD を作る（toISOStringはUTCなので使わない）
function ymd(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function todayStr(){return ymd(new Date())}
// 翌月末日
function nextMonthEnd(){
  const now=new Date();
  return ymd(new Date(now.getFullYear(), now.getMonth()+2, 0));
}
function fmt(n){return Math.round(n).toLocaleString('ja-JP')}
function fmtY(n){return (Math.round(n)<0?'-¥':'¥')+fmt(Math.abs(n))}
// 入力欄の数値：全角・カンマ・△▲も受け付ける（不正なら0）
function numIn(v){if(v===''||v==null)return '';const n=toNum(v);return n===null?0:n;}
const lineAmt=l=>(parseFloat(l.qty)||0)*(parseFloat(l.unitPrice)||0);
const isNegLine=l=>lineAmt(l)<0||(parseFloat(l.unitPrice)||0)<0||(parseFloat(l.qty)||0)<0;
const NEG='#c0392b';
function docInfo(){return DOCS.find(d=>d.id===S.docType)}

function updateBadge(){
  const taxL=S.taxType==='inc'?'税込':'税抜';
  const d=docInfo();
  document.getElementById('doc-badge').textContent=`${d.label}（${taxL}）`;
  const b=document.getElementById('sb-brand');if(b)b.textContent=ISSUER.name;
  const v=document.getElementById('app-ver');if(v)v.textContent='v'+APP_VERSION;
}

function renderDocBtns(){ /* 帳票は案件から作成するため、書類種別ボタンは廃止 */ }

function setDoc(id){
  saveFormState();
  docForms[S.docType]=JSON.parse(JSON.stringify(F)); // 現在の書類データを保存
  S.docType=id;
  if(docForms[id]){
    F=JSON.parse(JSON.stringify(docForms[id])); // 切替先のデータを復元
  } else {
    F=S.projectId?prefillFromProject(getProject(S.projectId),id):defaultF(); // 初回は空データ（案件紐づけ中は案件情報を入れる）
  }
  renderDocBtns();updateBadge();renderForm();
  setTimeout(()=>{refreshNoDisplay();autoPreview();},50);
}
function setTax(t){
  setTimeout(markDirty,0);
  saveFormState();S.taxType=t;
  document.getElementById('tax-inc').classList.toggle('active',t==='inc');
  document.getElementById('tax-exc').classList.toggle('active',t==='exc');
  renderDocBtns();updateBadge();renderForm();autoPreview();
}
function setPat(p){saveFormState();S.pattern=p;renderDocBtns();updateBadge();autoPreview();}
function setTaxRate(r){S.taxRate=10;}

// プレビュー自動更新（プレビュータブ表示中のみ）
function autoPreview(){
  if(S.mainTab==='preview') renderPreview();
}

function setMainTab(t){
  const inEditor=t==='form'||t==='preview';
  if(inEditor&&!S.projectId){t='proj';}            // 帳票は案件からのみ
  if(!inEditor&&(S.mainTab==='form')&&document.getElementById('f-date')) saveFormState();
  if(!inEditor)autoSaveNow();
  S.mainTab=t;
  const editor=t==='form'||t==='preview';
  ['dash','proj','issued','received','master'].forEach(id=>{
    const b=document.getElementById('nav-'+id);
    if(b)b.classList.toggle('active',id===t||(editor&&(S.backTo||'proj')===id));
  });
  document.getElementById('mtab-form').classList.toggle('active',t==='form');
  document.getElementById('mtab-prev').classList.toggle('active',t==='preview');
  ['dash','proj','issued','received','master','form','preview'].forEach(id=>{
    document.getElementById('panel-'+id).style.display=id===t?'block':'none';
  });
  document.getElementById('editor-tabs').style.display=editor?'flex':'none';
  document.getElementById('est2inv-btn').style.display=editor&&S.docType==='estimate'?'':'none';
  document.getElementById('back-btn').textContent=S.backTo==='issued'?'← 発行請求書一覧に戻る':'← 案件に戻る';
  document.getElementById('main-bar').style.display=editor?'flex':'none';

function saveFormState(){
  const ids=['no','date','dueDate','deliveryDate','client','clientTitle','clientAddr','dept','contactName',
    'butashi','receiptAmt','note','subject','site'];
  ids.forEach(k=>{const el=document.getElementById('f-'+k);if(el)F[k]=el.value;});
  const rows=document.querySelectorAll('.line-row');
  if(rows.length>0){
    F.lines=Array.from(rows).map(row=>({
      desc:row.querySelector('.ld').value,
      qty:numIn(row.querySelector('.lq').value),
      unit:row.querySelector('.lu').value,
      unitPrice:numIn(row.querySelector('.lp').value),
      memo:row.querySelector('.lm')?row.querySelector('.lm').value:'',
      cost:row.querySelector('.lc')?numIn(row.querySelector('.lc').value):(row.dataset.cost===undefined||row.dataset.cost===''?'':parseFloat(row.dataset.cost))
    }));
  }
}

function calcTotals(){
  const lines=F.lines.map(l=>({...l,amount:(parseFloat(l.qty)||0)*(parseFloat(l.unitPrice)||0)}));
  const subtotal=lines.reduce((s,l)=>s+l.amount,0);
  const tax=S.taxType==='exc'?Math.round(subtotal*S.taxRate/100):0;
  const total=subtotal+tax;
  return {lines,subtotal,tax,total};
}

// 明細から売上・原価・粗利（税抜）を計算
function lineProfit(lines,taxType){
  let sales=0,cost=0,missing=0;
  (lines||[]).forEach(l=>{
    const q=parseFloat(l.qty)||0,pz=parseFloat(l.unitPrice)||0;
    if(!q&&!pz)return;
    sales+=q*pz;
    if(l.cost===''||l.cost==null||l.cost===undefined){missing++;return;}
    cost+=q*(parseFloat(l.cost)||0);
  });
  if(taxType!=='exc'){sales=sales/1.1;cost=cost/1.1;} // 税込入力は税抜に換算
  sales=Math.round(sales);cost=Math.round(cost);
  const profit=sales-cost;
  return {sales,cost,profit,missing,rate:sales?Math.round(profit/sales*1000)/10:0};
}
// ===== 自動保存（入力が止まって約1.5秒後に、案件へ下書き保存） =====
const AUTO={timer:null,dirty:false,saving:false};
function markDirty(){
  if(!S.projectId||!(S.mainTab==='form'||S.mainTab==='preview'))return;
  AUTO.dirty=true;
  const n=document.getElementById('autosave-note');if(n)n.innerHTML='<span style="color:#b86e00">● 未保存（まもなく自動保存）</span>';
  clearTimeout(AUTO.timer);AUTO.timer=setTimeout(autoSaveNow,1500);
}
function autoSaveNow(){
  clearTimeout(AUTO.timer);
  if(!AUTO.dirty||!S.projectId)return;
  const proj=getProject(S.projectId);if(!proj)return;
  if(document.getElementById('f-date'))saveFormState();
  AUTO.dirty=false;
  saveDocToProject(proj,F.issued?'発行済':'下書き');
  const d=new Date();const hm=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
  const n=document.getElementById('autosave-note');if(n)n.textContent=`✓ 自動保存 ${hm}`;
}

window.addEventListener('beforeunload',e=>{
  if(AUTO.dirty)autoSaveNow();
  if(AUTO.dirty||(typeof SH!=='undefined'&&SH.pending)){e.preventDefault();e.returnValue='';}
});

function removeLine(i){

  if(F.lines.length>1)F.lines.splice(i,1);

function moveLine(from,to){
  saveFormState();
  if(to<0||to>=F.lines.length||from===to)return;
  const [l]=F.lines.splice(from,1);F.lines.splice(to,0,l);
  renderForm();markDirty();
  // 動かした行が分かるように少し光らせる
  const r=document.querySelectorAll('.line-row')[to];if(r){r.classList.add('moved');setTimeout(()=>r.classList.remove('moved'),700);}
}
const LDRAG={from:null};
function lineDragStart(e,i){LDRAG.from=i;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(i));}catch{}e.currentTarget.classList.add('dragging');}
function lineDragOver(e,i){
  if(LDRAG.from===null)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  const r=e.currentTarget.getBoundingClientRect(),below=e.clientY>r.top+r.height/2;
  e.currentTarget.classList.toggle('drop-below',below);e.currentTarget.classList.toggle('drop-above',!below);
}
function lineDrop(e,i){
  e.preventDefault();if(LDRAG.from===null)return;
  const r=e.currentTarget.getBoundingClientRect(),below=e.clientY>r.top+r.height/2;
  const from=LDRAG.from;let to=i+(below?1:0);if(from<to)to--;
  LDRAG.from=null;moveLine(from,to);
}
function lineDragEnd(){LDRAG.from=null;document.querySelectorAll('.line-row').forEach(r=>{r.draggable=false;r.classList.remove('dragging','drop-above','drop-below');});}
function updateAmt(i){
  const rows=document.querySelectorAll('.line-row');
  const row=rows[i]; if(!row)return;
  const qv=row.querySelector('.lq').value;
  const pv=row.querySelector('.lp').value;
  const qty=numIn(qv)||0;
  const price=numIn(pv)||0;
  const el=document.getElementById('la-'+i);
  if(el)el.textContent=(qv===''&&pv==='')?'':fmt(qty*price);
  // 仕入金額（仕入単価×数量）
  const ce=document.getElementById('lca-'+i),ci=row.querySelector('.lc');
  if(ce&&ci){const cv=numIn(ci.value);ce.textContent=cv===''?'':fmt(qty*cv);}
  // 値引き（マイナス）の行は赤文字
  row.classList.toggle('neg-row',qty*price<0||price<0||qty<0);
  updateSubtotalDisplay();
}
function updateSubtotalDisplay(){
  // re-read lines and update running total shown in form
  const rows=document.querySelectorAll('.line-row');
  let sub=0;
  rows.forEach(row=>{
    const q=numIn(row.querySelector('.lq').value)||0;
    const p=numIn(row.querySelector('.lp').value)||0;
    sub+=q*p;
  });
  const el=document.getElementById('form-subtotal');
  // 見積書：粗利（税抜）を表示
  const pe=document.getElementById('form-profit');
  if(pe){
    const ls=Array.from(rows).map(row=>({qty:numIn(row.querySelector('.lq').value),unitPrice:numIn(row.querySelector('.lp').value),cost:row.querySelector('.lc')?numIn(row.querySelector('.lc').value):''}));
    const pr=lineProfit(ls,S.taxType);
    const costSum=ls.reduce((a,l)=>a+(l.cost===''||l.cost==null?0:(l.qty===''?0:l.qty||0)*(l.cost||0)),0);
    const taxL=S.taxType==='inc'?'税込':'税抜';
    pe.innerHTML=(costSum||pr.sales?`仕入合計（${taxL}）<b style="color:#7a6a2a">${fmtY(costSum)}</b>　`:'')+(pr.sales?`粗利（税抜）<b style="color:${pr.profit<0?'#c0392b':'#1e4a32'}">${fmtY(pr.profit)}</b>（${pr.rate}%）${pr.missing?`<span style="color:#b86e00">　※仕入単価が未入力の行が${pr.missing}行あります</span>`:''}`:'');
  }
  if(el){
    if(S.taxType==='inc'){
      el.textContent='合計（税込）：'+fmtY(sub);
    } else {
      const tax=Math.round(sub*S.taxRate/100);
      el.textContent=`小計：${fmtY(sub)}　消費税（${S.taxRate}%）：${fmtY(tax)}　合計：${fmtY(sub+tax)}`;
    }
  }
}

// YYYY-MM-DD → {era:'令和', y:'8', m:'7', d:'6'}
function wareki(s){
  if(!s)return null;
  const [Y,M,D]=s.split('-').map(Number);
  const parts=new Intl.DateTimeFormat('ja-JP-u-ca-japanese',{era:'long',year:'numeric',month:'numeric',day:'numeric'})
    .formatToParts(new Date(Y,M-1,D));
  const g=t=>(parts.find(p=>p.type===t)||{}).value||'';
  const y=g('year');
  return {era:g('era'), y:y==='1'?'元':y, m:String(M), d:String(D)};
}

  `;
  tbody.appendChild(tr);
  tr.querySelectorAll('input').forEach(inp=>inp.addEventListener('paste',handleGridPaste));
}

function handleGridPaste(e){
  e.preventDefault();
  const text=(e.clipboardData||window.clipboardData).getData('text');
  const col=parseInt(e.target.dataset.col);
  const colClasses=['pg-desc','pg-qty','pg-unit','pg-price','pg-memo'];
  // Excel由来の末尾改行・CRLFを除去（空セルを保つため trim は改行だけに限定）
  const rows=text.replace(/[\r\n]+$/,'').split(/\r?\n/);
  const isMultiCol=rows[0].includes('\t');

  const tbody=document.getElementById('paste-tbody');

  if(isMultiCol){
    // タブ区切り：全列一括貼り付け（どのセルから貼り付けても全展開）
    tbody.innerHTML='';
    rows.forEach(row=>{
      if(!row.trim())return;
      const cols=row.split('\t');
      addPasteRow();
      const tr=tbody.lastElementChild;
      tr.querySelector('.pg-desc').value=cols[0]?.trim()||'';
      // 空欄は空欄のまま（勝手に「1」「台」「0」を入れない）
      tr.querySelector('.pg-qty').value=cols[1]?.trim()||'';
      tr.querySelector('.pg-unit').value=cols[2]?.trim()||'';
      tr.querySelector('.pg-price').value=(cols[3]||'').trim().replace(/[,，¥￥円"]/g,'');
      tr.querySelector('.pg-memo').value=cols[4]?.trim()||'';
    });
  } else {
    // 改行区切り：その列だけ上から埋める
    const startRow=Array.from(tbody.children).indexOf(e.target.closest('tr'));
    rows.forEach((val,i)=>{
      if(!val.trim())return;
      const rowIdx=startRow+i;
      // 行が足りなければ追加
      while(tbody.children.length<=rowIdx) addPasteRow();
      const tr=tbody.children[rowIdx];
      const inp=tr.querySelector('.'+colClasses[col]);
      if(inp){
        let v=val.trim();
        if(col===3) v=v.replace(/[,，¥￥円"]/g,'');
        inp.value=v;
      }
    });
  }
}

// 連番は日付ごと（全書類共通）。番号形式：接頭辞＋YYYYMMDD＋2桁連番（例：S2026100301）
function seqKey(date){
  return `hanhyo_seq_${(date||'').replace(/-/g,'')}`;
}
function getSeq(date){
  const v=parseInt(localStorage.getItem(seqKey(date))||'0')||0;
  // 2人で使っても重ならないよう、発行済みの書類番号の最大値＋1も見る
  const d=(date||'').replace(/-/g,'');
  let used=0;
  try{getProjects().forEach(p=>(p.docs||[]).forEach(x=>{if(x.status!=='発行済')return;const r=String(x.no||'').match(/^[A-Za-z]?(\d{8})(\d{2,})$/);if(r&&r[1]===d)used=Math.max(used,+r[2]);}));}catch{}
  return Math.max(v,used+1,1);
}
function setSeqStore(date, val){
  localStorage.setItem(seqKey(date), String(val));
}
function buildNo(date, seq){
  const d=(date||todayStr()).replace(/-/g,'');
  const s=String(seq).padStart(2,'0');
  const prefixes={'invoice':'S','estimate':'M','receipt':'R','delivery':'N','order':'H','payment':''};
  const prefix=prefixes[S.docType]||'';
  return `${prefix}${d}${s}`;
}

const PDFJS_VER='6.2.108';
const PDFJS_BASES=[`https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}/`,`https://unpkg.com/pdfjs-dist@${PDFJS_VER}/`];
let pdfjsLib=null,pdfjsBase=null;
// 新しいブラウザ機能の補い（pdf.js が使うもの）
if(!Math.sumPrecise)Math.sumPrecise=a=>{let t=0;for(const x of a)t+=x;return t;};
[Map,WeakMap].forEach(C=>{
  if(!C.prototype.getOrInsertComputed)Object.defineProperty(C.prototype,'getOrInsertComputed',{configurable:true,writable:true,value(k,cb){if(this.has(k))return this.get(k);const v=cb(k);this.set(k,v);return v;}});
  if(!C.prototype.getOrInsert)Object.defineProperty(C.prototype,'getOrInsert',{configurable:true,writable:true,value(k,v){if(!this.has(k))this.set(k,v);return this.get(k);}});
});
async function loadPdfjs(){
  if(pdfjsLib)return pdfjsLib;
  for(const base of PDFJS_BASES){
    try{
      // 処理部品もこのページ内で動かす（上の補いが効くように）
      const w=await import(base+'build/pdf.worker.min.mjs');
      globalThis.pdfjsWorker=w;
      const m=await import(base+'build/pdf.min.mjs');
      m.GlobalWorkerOptions.workerSrc=base+'build/pdf.worker.min.mjs';
      pdfjsLib=m;pdfjsBase=base;return m;
    }catch(e){console.warn('pdf.js load failed',base,e);}
  }
  throw new Error('PDFを読む部品を読み込めませんでした。インターネットに接続して再度お試しください。');
}
const zen2han=s=>String(s||'').replace(/[０-９．，－]/g,c=>({'．':'.','，':',','－':'-'}[c]||String.fromCharCode(c.charCodeAt(0)-0xFEE0)));
// "1,200" "¥1,200" "△500" "1.5" → 数値（数値でなければ null）
function toNum(s){
  let t=zen2han(s).replace(/[¥￥円\s|¦｜]/g,'').replace(/^\\/,'').replace(/^[△▲]/,'-');
  t=t.replace(/(\d)\.?-$/,'$1');                 // 「1.-」「1-」→ 1
  if(/^-?\d{1,3}([.,]\d{3})+$/.test(t))t=t.replace(/[.,]/g,''); // 615.000 / 615,000 → 615000
  t=t.replace(/,/g,'');
  return /^-?\d+(\.\d+)?$/.test(t)?parseFloat(t):null;
}
// 日本語の文字の間に入った余計な空白を取る（OCR対策）
const cjkTight=s=>String(s||'').replace(/(?<=[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef])[ \t]+(?=[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef])/g,'').trim();
const IMP_UNITS=['式','台','個','枚','本','m','ｍ','m2','m3','㎡','㎥','m²','m³','坪','箇所','ヶ所','カ所','か所','ケ所','セット','組','人工','日','回','缶','袋','巻','kg','t','L','ℓ','セット','基','面','箱','ケース','丁','脚','枚','件','ヶ月','月','時間','式'];

// PDF → 行（同じ高さの文字をまとめ、近い文字をセルにまとめる）
async function pdfToRows(file){
  const lib=await loadPdfjs();
  const data=new Uint8Array(await file.arrayBuffer());
  const pdf=await lib.getDocument({data,cMapUrl:pdfjsBase+'cmaps/',cMapPacked:true,standardFontDataUrl:pdfjsBase+'standard_fonts/'}).promise;
  const pages=[];let chars=0;
  for(let pn=1;pn<=pdf.numPages;pn++){
    const page=await pdf.getPage(pn);
    const tc=await page.getTextContent();
    const items=tc.items.filter(it=>it.str&&it.str.trim()).map(it=>{
      const [a,b,c,d,e,f]=it.transform;const h=Math.hypot(c,d)||it.height||10;
      return {str:it.str,x:e,y:f,w:it.width||h*it.str.length*0.6,h};
    });
    items.forEach(i=>chars+=i.str.trim().length);
    items.sort((p,q)=>q.y-p.y||p.x-q.x);
    const rows=[];
    items.forEach(it=>{
      const r=rows.find(r=>Math.abs(r.y-it.y)<=Math.max(2,Math.min(r.h,it.h)*0.45));
      if(r){r.items.push(it);}else rows.push({y:it.y,h:it.h,items:[it]});
    });
    rows.forEach(r=>{
      r.items.sort((p,q)=>p.x-q.x);
      const cells=[];
      r.items.forEach(it=>{
        const last=cells[cells.length-1];
        const gap=last?it.x-last.x1:Infinity;
        if(last&&gap<Math.max(it.h*1.15,3)){
          last.text+=(gap>it.h*0.3?' ':'')+it.str;
          last.x1=Math.max(last.x1,it.x+it.w);
        } else cells.push({text:it.str,x0:it.x,x1:it.x+it.w});
      });
      cells.forEach(c=>{c.text=c.text.replace(/\s+/g,' ').trim();c.cx=(c.x0+c.x1)/2;});
      r.cells=cells.filter(c=>c.text);
    });
    pages.push(rows.sort((p,q)=>q.y-p.y));
  }
  return {pages,chars,pdf};
}

// ---------- スキャンPDF（画像）の読み取り：表の罫線を見つけて、マスごとに文字認識 ----------
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let tessWorkers=null;
async function loadTesseract(){
  if(window.Tesseract)return;
  await new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=TESS_URL;sc.onload=res;
    sc.onerror=()=>rej(new Error('文字認識の部品を読み込めませんでした。インターネットに接続して再度お試しください。'));document.head.appendChild(sc);});
}
async function getTessWorkers(){
  if(tessWorkers)return tessWorkers;
  await loadTesseract();
  const jpn=await Tesseract.createWorker('jpn');
  await jpn.setParameters({tessedit_pageseg_mode:'7',preserve_interword_spaces:'1'});
  const num=await Tesseract.createWorker('eng');
  await num.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:'0123456789,.-¥\\\\'});
  tessWorkers={jpn,num};return tessWorkers;
}
// 1マス分の文字認識（テスト時は差し替え可能）
async function ocrCell(canvas,kind){
  if(window.__ocrStub)return window.__ocrStub(canvas.toDataURL('image/png'),kind);
  const w=await getTessWorkers();
  const {data}=await (kind==='num'?w.num:w.jpn).recognize(canvas);
  return (data.text||'').replace(/\n+/g,' ').trim();
}
// OCR結果の整形：「\964, 280」→「¥964,280」
function ocrTidy(t){return String(t||'').replace(/\\(?=\d)/g,'¥').replace(/(\d)[,，]\s+(\d{3})/g,'$1,$2');}

// ---------- 表になっていない書類（文章だけ）の読み取り ----------
// 1ページ全体を文字認識して文章にする（スキャンPDF・写真用）
let tessPageWorker=null;
async function ocrPageText(canvas){
  if(window.__ocrStub)return window.__ocrStub(canvas.toDataURL('image/png'),'page');
  if(!tessPageWorker){await loadTesseract();tessPageWorker=await Tesseract.createWorker('jpn');await tessPageWorker.setParameters({tessedit_pageseg_mode:'6',preserve_interword_spaces:'1'});}
  const {data}=await tessPageWorker.recognize(canvas);
  return data.text||'';
}
async function renderPageCanvas(page){
  const vp0=page.getViewport({scale:1});let scale=300/72;
  const maxDim=Math.max(vp0.width,vp0.height)*scale;if(maxDim>4300)scale*=4300/maxDim;
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;return cv;
}
async function imageFileCanvas(file){
  const bmp=await createImageBitmap(file);
  let s=1;const m=Math.max(bmp.width,bmp.height);if(m<1800)s=1800/m;if(m*s>4300)s=4300/m;
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(bmp,0,0,cv.width,cv.height);return cv;
}
// PDF・写真 → 文章（文字情報があればそのまま、なければ文字認識）
async function fileToText(file,onStatus){
  const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
  if(!isPdf){onStatus&&onStatus('写真から文字を読み取っています…');return {text:cjkTight(ocrTidy(await ocrPageText(await imageFileCanvas(file)))),ocr:true};}
  const {pages,chars,pdf}=await pdfToRows(file);
  if(chars>=15)return {text:pages.map(rows=>rows.map(r=>r.cells.map(c=>c.text).join('  ')).join('\n')).join('\n'),ocr:false,pages,pdf};
  const out=[];
  for(let pn=1;pn<=pdf.numPages;pn++){
    onStatus&&onStatus(`スキャンしたPDFのため、画像から文字を読み取っています…${pdf.numPages>1?`（${pn}/${pdf.numPages}ページ）`:''}`);
    out.push(await ocrPageText(await renderPageCanvas(await pdf.getPage(pn))));
  }
  return {text:cjkTight(ocrTidy(out.join('\n'))),ocr:true,pdf,scanned:true};
}
// 日付：2025年8月31日 / 2025/8/31 / 令和7年8月31日 / R7.8.31
function parseJDate(s){
  s=zen2han(s||'');
  let m=s.match(/(20\d{2})\s*[年\/\.\-]\s*(\d{1,2})\s*[月\/\.\-]\s*(\d{1,2})/);
  if(!m){const r=s.match(/(?:令和|R)\s*(\d{1,2}|元)\s*[年\.\/]\s*(\d{1,2})\s*[月\.\/]\s*(\d{1,2})/);if(r)m=[0,2018+(r[1]==='元'?1:+r[1]),r[2],r[3]];}
  if(!m)return '';
  const y=+m[1],mo=+m[2],d=+m[3];if(mo<1||mo>12||d<1||d>31)return '';
  return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function findLabeledDate(lines,re){
  for(let i=0;i<lines.length;i++)if(re.test(lines[i])){const d=parseJDate(lines[i])||parseJDate(lines[i+1]||'');if(d)return d;}
  return '';
}
const LABEL_TOTAL=/(御?請求金額|ご請求金額|ご請求額|請求額|今回(?:ご)?請求額|御?見積金額|お見積(?:り)?金額|御見積合計|税込合計|総合計|合計金額|お支払(?:い)?金額|合計)/;
// 合計金額・税込/税抜・消費税・日付・相手先を探す
function readDocSummary(text){
  const t=zen2han(text||'');const lines=t.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let best=null;
  lines.forEach((ln,i)=>{
    const m=ln.match(LABEL_TOTAL);if(!m)return;
    const after=ln.slice(m.index+m[0].length)+' '+(lines[i+1]||'');
    const n=after.match(/[¥￥]?\s*(-?\d{1,3}(?:,\d{3})+|-?\d{3,})\s*(?:円|-|\.-)?/);if(!n)return;
    const v=toNum(n[1]);if(v===null)return;
    const ctx=ln+' '+(lines[i+1]||'');
    const inc=/税込|内税|消費税込/.test(ctx)?true:/税抜|税別|外税/.test(ctx)?false:null;
    const prio=/請求|見積|総合計|税込合計|お支払/.test(m[1])?2:1;
    if(!best||prio>best.prio||(prio===best.prio&&v>best.amount))best={amount:v,inc,prio,label:m[1]};
  });
  let tax='';
  for(const ln of lines){if(/消費税/.test(ln)&&!/込|抜|別/.test(ln.replace(/\(?10%\)?/,''))||/^.{0,6}消費税/.test(ln)){const n=ln.match(/([\d,]{2,})\s*円?\s*$/);if(n){tax=toNum(n[1]);break;}}}
  const due=findLabeledDate(lines,/支払期限|お支払(?:い)?期限|振込期限|お振込(?:み)?期限|支払期日|お支払(?:い)?期日|支払日|お支払(?:い)?予定日/);
  const date=findLabeledDate(lines,/請求日|発行日|見積日|作成日|発行年月日/)||(()=>{for(const l of lines){if(/期限|期日|有効/.test(l))continue;const d=parseJDate(l);if(d)return d;}return '';})();
  let no='';for(const l of lines){const r=l.match(/(?:請求書|見積書)?\s*(?:番号|No\.?|NO\.?|№)\s*[:：]?\s*([A-Za-z0-9\-]{3,})/);if(r){no=r[1];break;}}
  const own=(ISSUER.name||'').replace(/\s/g,'');
  let vendor='';
  for(const l of lines){
    const c=l.replace(/\s/g,'');
    if(!/(株式会社|有限会社|合同会社|\(株\)|（株）|\(有\)|（有）|工業|建材|商会|商店|工務店|設備)/.test(c))continue;
    if(/御中|様|殿/.test(c)||(own&&c.includes(own)))continue;
    vendor=l.replace(/\s{2,}.*$/,'').replace(/(TEL|FAX|〒).*$/,'').trim();if(vendor)break;
  }
  return {amount:best?best.amount:'',inc:best?best.inc:null,tax,due,date,no,vendor};
}
// 文章の各行から「品名＋金額」を探す
const SKIP_LINE=/(支払|振込|期限|期日|有効|口座|銀行|支店|普通預金|当座|名義|TEL|FAX|〒|登録番号|発行日|請求日|見積日|作成日|住所|担当|電話|メール|http|@)/;
function parsePlainLines(text){
  const out=[];
  for(const raw of String(text||'').split(/\r?\n/)){
    let t=zen2han(raw).replace(/[■□●○◆◇◎★☆※・]/g,' ').replace(/\s+/g,' ').trim();
    if(!t||SKIP_LINE.test(t))continue;
    const m=t.match(/^(.*?)[\s:：…\.\-=＝]*(?:[¥￥]\s*)?(-?\d{1,3}(?:,\d{3})+|-?\d+)\s*(?:円|\.-|-)?\s*(?:[（(]\s*(税込|税抜|税別)\s*[)）])?\s*$/);
    if(!m)continue;
    let head=m[1].replace(/[\s:：…\.\-=＝]+$/,'').trim();
    const amt=toNum(m[2]);
    if(amt===null||!head||toNum(head)!==null)continue;
    if(Math.abs(amt)<100&&!/[¥￥円]/.test(t))continue;   // 数量だけの行などは除外
    let qty=1,unit='式',desc=head;
    const q=head.match(/^(.*?)[\s]*(?:[x×＊*]\s*)?(\d+(?:\.\d+)?)\s*(式|台|個|枚|本|m2|m3|㎡|㎥|m|箇所|ヶ所|カ所|か所|ケ所|セット|組|人工|日|回|缶|袋|巻|kg|t|L|基|面|箱|件|ヶ月|月|時間|坪)\s*$/);
    if(q&&q[1].trim()){desc=q[1].trim();qty=+q[2];unit=q[3];}
    desc=desc.replace(/[\s:：…\.\-=＝]+$/,'');
    const neg=/値引|割引|出精|調整/.test(desc)&&amt>0?-1:1;
    const total=LABEL_TOTAL.test(desc.replace(/\s/g,''))||/消費税|小計/.test(desc);
    out.push({desc,qty,unit,price:qty?Math.round(amt*neg/qty*100)/100:amt*neg,amount:amt*neg,memo:'',kind:total?'total':'item'});
  }
  return out;
}
// 文章から仕入見積の行を作る：品目が見つからなければ合計を「一式」1行に
function plainToImportLines(text,fallbackName){
  const lines=parsePlainLines(text);
  const sum=readDocSummary(text);
  if(lines.some(l=>l.kind==='item'))return {lines,sum,mode:'lines'};
  if(sum.amount!=='')return {lines:[{desc:fallbackName||'一式',qty:1,unit:'式',price:sum.amount,amount:sum.amount,memo:'',kind:'item'}],sum,mode:'total'};
  return {lines:[],sum,mode:'none'};
}
async function renderPageGray(page){
  const vp0=page.getViewport({scale:1});
  let scale=300/72;
  const maxDim=Math.max(vp0.width,vp0.height)*scale;
  if(maxDim>4300)scale*=4300/maxDim;
  const vp=page.getViewport({scale});
  const cv=document.createElement('canvas');cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  const W=cv.width,H=cv.height,px=ctx.getImageData(0,0,W,H).data;
  const g=new Uint8Array(W*H);
  for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(px[j]*299+px[j+1]*587+px[j+2]*114)/1000;
  return {g,W,H,f:scale/(300/72)};
}
function groupIdx(idx,gap){const out=[];idx.forEach(v=>{const l=out[out.length-1];if(l&&v-l[l.length-1]<=gap)l.push(v);else out.push([v]);});return out.map(a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length));}
// 罫線から表のマス目を探す
function findGrid(img){
  const {g,W,H,f}=img;const K=Math.max(3,Math.round(6*f));const thr=img.thr||170;
  const d=new Uint8Array(W*H);for(let i=0;i<d.length;i++)d[i]=g[i]<thr?1:0;
  // 縦方向に太らせた画像で横線、横方向に太らせた画像で縦線を探す（少しの傾きに対応）
  const rowSum=new Float64Array(H),dx=new Uint8Array(W*H);
  for(let x=0;x<W;x++){
    let cnt=0;
    for(let y=0;y<Math.min(H,K);y++)cnt+=d[y*W+x];
    for(let y=0;y<H;y++){
      if(y+K<H)cnt+=d[(y+K)*W+x];
      if(y-K-1>=0)cnt-=d[(y-K-1)*W+x];
      if(cnt>0)rowSum[y]++;
    }
  }
  for(let y=0;y<H;y++){
    let cnt=0;const o=y*W;
    for(let x=0;x<Math.min(W,K);x++)cnt+=d[o+x];
    for(let x=0;x<W;x++){
      if(x+K<W)cnt+=d[o+x+K];
      if(x-K-1>=0)cnt-=d[o+x-K-1];
      dx[o+x]=cnt>0?1:0;
    }
  }
  const hl=groupIdx([...rowSum.keys()].filter(y=>rowSum[y]>W*0.6),K+2);
  const colSum=new Float64Array(W);for(let y=0;y<H;y++){const o=y*W;for(let x=0;x<W;x++)colSum[x]+=dx[o+x];}
  const vc=groupIdx([...colSum.keys()].filter(x=>colSum[x]>H*0.2),K+2);
  const crosses=(x,y0,y1)=>{let n=0,t=0;for(let y=y0+3;y<y1-3;y++){t++;let a=0;for(let xx=Math.max(0,x-2);xx<=Math.min(W-1,x+2);xx++)if(dx[y*W+xx]){a=1;break;}n+=a;}return t?n/t:0;};
  const bands=[];for(let i=0;i<hl.length-1;i++)bands.push([hl[i],hl[i+1]]);
  const ok=bands.map(([y0,y1])=>vc.filter(x=>crosses(x,y0,y1)>0.97).length>=4);
  let best=[0,0];for(let i=0;i<ok.length;){if(ok[i]){let j=i;while(j<ok.length&&ok[j])j++;if(j-i>best[1]-best[0])best=[i,j];i=j;}else i++;}
  const tb=bands.slice(best[0],best[1]);
  if(tb.length<2)return null;
  const avg=(arr,fn)=>arr.reduce((a,b)=>a+fn(b),0)/arr.length;
  const colx=vc.filter(x=>avg(tb,([y0,y1])=>crosses(x,y0,y1)>0.97?1:0)>0.9);
  // 点線（桁の区切りなど）：各マスの上端近くから下端近くまで続く線だけ。文字（マスの中ほどにある）は対象外
  const spans=(x,y0,y1)=>{
    const q=Math.max(3,Math.round((y1-y0)/4));
    const hit=(a,b)=>{for(let y=a;y<b;y++)for(let xx=Math.max(0,x-1);xx<=Math.min(W-1,x+1);xx++)if(d[y*W+xx])return true;return false;};
    return hit(y0+3,y0+q)&&hit(y1-q,y1-3);
  };
  const dotted=vc.filter(x=>!colx.includes(x)&&avg(tb,([y0,y1])=>crosses(x,y0,y1))>0.3&&avg(tb.slice(1),([y0,y1])=>spans(x,y0,y1)?1:0)>0.7);
  if(colx.length<3)return null;
  return {tb,colx,dotted,K};
}
function cropCell(img,grid,y0,y1,x0,x1){
  const {g,W,f}=img;const pad=Math.round(9*f),P=20;
  const cw=x1-x0-2*pad,ch=y1-y0-2*pad;if(cw<4||ch<4)return null;
  const cv=document.createElement('canvas');cv.width=cw+2*P;cv.height=ch+2*P;
  const ctx=cv.getContext('2d');const id=ctx.createImageData(cv.width,cv.height);
  let ink=0;
  for(let y=0;y<cv.height;y++)for(let x=0;x<cv.width;x++){
    const sx=x-P+x0+pad,sy=y-P+y0+pad;
    let v=255;
    if(x>=P&&x<P+cw&&y>=P&&y<P+ch){
      v=g[sy*W+sx];
      // 金額欄などの点線（桁区切り）は消す
      if(grid.dotted.some(dxp=>Math.abs(sx-dxp)<=grid.K+3))v=255;
      if(v<150)ink++;
    }
    const o=(y*cv.width+x)*4;id.data[o]=id.data[o+1]=id.data[o+2]=v;id.data[o+3]=255;
  }
  if(ink<Math.max(15,40*f*f))return null;
  ctx.putImageData(id,0,0);return cv;
}
function headerKey(t){
  t=t.replace(/[\s　:：.・]/g,'');
  if(/^(No|NO|N0|№|番号|項)$/i.test(t))return 'no';
  if(/位/.test(t))return 'unit';
  if(/価/.test(t))return 'price';
  if(/額|金/.test(t))return 'amount';
  if(/数/.test(t))return 'qty';
  if(/備|考/.test(t))return 'memo';
  if(/規|格|仕様|型/.test(t))return 'spec';
  if(/名|称|品|内容|摘要|項目|工事/.test(t))return 'desc';
  return null;
}
async function ocrQuoteFromPdf(pdf,onProgress){
  const lines=[];let tableFound=false;
  for(let pn=1;pn<=pdf.numPages;pn++){
    const img=await renderPageGray(await pdf.getPage(pn));
    const r=await ocrTableFromGray(img,(n,t)=>onProgress&&onProgress(n,t,pn,pdf.numPages));
    if(r.tableFound){tableFound=true;lines.push(...r.lines);}
  }
  return {lines,tableFound};
}
// 画像（スクショ・写真）の表を読む
function grayFromCanvas(cv){
  const W=cv.width,H=cv.height,px=cv.getContext('2d').getImageData(0,0,W,H).data;
  const g=new Uint8Array(W*H);for(let i=0,j=0;i<g.length;i++,j+=4)g[i]=(px[j]*299+px[j+1]*587+px[j+2]*114)/1000;
  // スクショは細い線が薄くなりやすいので、薄い線も拾う
  return {g,W,H,f:Math.max(.35,Math.min(1,W/2480)),thr:window.__thr||205};
}
async function tableCanvasFromImage(file){
  const bmp=await createImageBitmap(file);
  // 小さなスクショは拡大して読みやすくする（A4を300dpi相当の幅に）
  let s=Math.max(1,Math.min(3,2480/bmp.width));
  const cv=document.createElement('canvas');cv.width=Math.round(bmp.width*s);cv.height=Math.round(bmp.height*s);
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingQuality='high';ctx.drawImage(bmp,0,0,cv.width,cv.height);return cv;
}
async function ocrTableFromGray(img,onProgress){
  const lines=[];
  {
    const grid=findGrid(img);
    if(!grid)return {lines,tableFound:false};
    const {tb,colx}=grid;
    // 見出し行
    const keys=[];
    for(let i=0;i<colx.length-1;i++){
      const c=cropCell(img,grid,tb[0][0],tb[0][1],colx[i],colx[i+1]);
      keys.push(c?headerKey(await ocrCell(c,'jpn')):null);
    }
    // 見出しが読めなかった数字の列は、右から 金額→単価→数量 とみなす
    const body=tb.slice(1);
    const cells=[];let done=0;const total=body.length*(colx.length-1);
    for(const [y0,y1] of body){
      const row=[];
      for(let i=0;i<colx.length-1;i++){
        const c=cropCell(img,grid,y0,y1,colx[i],colx[i+1]);
        const k=keys[i];
        const kind=['qty','price','amount'].includes(k)?'num':'jpn';
        row.push(c?await ocrCell(c,kind):'');
        onProgress&&onProgress(++done,total);
      }
      cells.push(row);
    }
    const unknownNum=[];
    for(let i=keys.length-1;i>=0;i--){
      if(keys[i])continue;
      const vals=cells.map(r=>r[i]).filter(Boolean);
      if(vals.length&&vals.filter(v=>toNum(v)!==null).length>=vals.length*0.6)unknownNum.push(i);
    }
    ['amount','price','qty'].filter(k=>!keys.includes(k)).forEach((k,j)=>{if(unknownNum[j]!=null)keys[unknownNum[j]]=k;});
    if(!keys.includes('desc')){const i=keys.findIndex(k=>!k);if(i>=0)keys[i]='desc';}
    cells.forEach(row=>{
      const L={desc:[],qty:[],unit:[],price:[],amount:[],memo:[],spec:[],no:[]};
      row.forEach((t,i)=>{if(t&&keys[i])L[keys[i]].push(cjkTight(ocrTidy(t)));});
      lines.push(finishLine(L));
    });
  }
  return {lines,tableFound:true};
}
function classifyLines(raw){
  return raw.map(l=>{
    const hasNum=l.qty!==null||l.price!==null||l.amount!==null;
    if(!l.desc&&!hasNum)return null;
    if(!l.desc&&hasNum)return {...l,kind:'total'};
    const isTotal=TOTAL_RE.test(l.desc.replace(/\s/g,''))&&(!l.qty||l.qty===1)&&l.price===null;
    return {...l,kind:isTotal?'total':hasNum?'item':'heading'};
  }).filter(Boolean);
}

const HDR={
  desc:/品名|品目|名称|摘要|内容|項目|商品|規格|仕様|工事|明細|件名/,
  qty:/^数量$|^数$|^数\s*量$/,
  unit:/^単位$/,
  price:/単価/,
  amount:/^金額|^価格$|^金\s*額$|^合計金額$|^小計$/,
  memo:/備考|摘要欄|メモ/,
  spec:/^(規格|仕様|型番|品番|型式|メーカー)$/,
  no:/^(No\.?|NO\.?|№|番号|項|項番|行)$/
};
const TOTAL_RE=/(小計|合計|総計|総額|消費税|税込|税抜|御見積金額|お見積金額|見積金額|値引後|計$)/;
const HDR_WORDS=/^(名称|品名|品目|規格|仕様|数量|単位|単価|金額|備考|摘要|内容|項目|番号)/;
function mergeHeaderCells(cells){
  const out=[];
  for(let i=0;i<cells.length;i++){
    const a=cells[i],t=a.text.replace(/[\s　]/g,'');
    const b=cells[i+1];
    if(b&&t.length===1){
      const t2=t+b.text.replace(/[\s　]/g,'');
      if(HDR_WORDS.test(t2)){out.push({text:t2,x0:a.x0,x1:b.x1,cx:(a.x0+b.x1)/2});i++;continue;}
    }
    out.push(a);
  }
  return out;
}
function detectHeader(row){
  const cols=[];
  mergeHeaderCells(row.cells).forEach(c=>{
    const t=c.text.replace(/[\s　]/g,'');
    let k=null;
    if(HDR.no.test(t))k='no';
    else if(HDR.spec.test(t))k='spec';
    else if(HDR.price.test(t))k='price';
    else if(HDR.qty.test(t))k='qty';
    else if(HDR.unit.test(t))k='unit';
    else if(HDR.memo.test(t))k='memo';
    else if(HDR.amount.test(t))k='amount';
    else if(HDR.desc.test(t)&&t.length<=10)k='desc';
    if(k&&!cols.some(x=>x.k===k))cols.push({k,cx:c.cx,x0:c.x0,x1:c.x1});
  });
  const has=k=>cols.some(c=>c.k===k);
  return (has('price')||has('amount'))&&(has('qty')||has('desc'))&&cols.filter(c=>!['no','spec'].includes(c.k)).length>=3?cols.sort((a,b)=>a.cx-b.cx):null;
}
// 1行を列に振り分け
function rowToLine(row,cols){
  const L={desc:[],qty:[],unit:[],price:[],amount:[],memo:[],spec:[],no:[]};
  row.cells.forEach(c=>{
    let best=null,bd=Infinity;
    cols.forEach(col=>{
      // 左寄せ・右寄せ・中央寄せのどれでも合うよう、左端・右端・中央の近い方で比べる
      const d=Math.min(Math.abs(c.cx-col.cx),Math.abs(c.x0-col.x0),Math.abs(c.x1-col.x1));
      if(d<bd){bd=d;best=col;}
    });
    L[best?best.k:'desc'].push(c.text);
  });
  return L;
}
function finishLine(L){
  let desc=[...L.desc,...L.spec].join(' ').trim(),unit=L.unit.join('').trim(),memo=L.memo.join(' ').trim();
  const num=arr=>{const t=arr.join('');return t?toNum(t):null;};
  // 数値列に文字が入った場合：数値（または「1台」のような数量＋単位）以外は品名へ
  ['qty','price','amount'].forEach(k=>{
    if(L[k].length&&num(L[k])===null){
      const keep=[];
      L[k].forEach(t0=>{
        // 「69,600 回送費込み」→ 数字は残し、後ろの文字は備考へ
        const sp=String(t0).match(/^(-?[\d,.]+)\s+(\D.*)$/);
        if(sp&&toNum(sp[1])!==null&&k!=='qty'){keep.push(sp[1]);memo=(memo?memo+' ':'')+sp[2];return;}
        const t=t0;
        if(toNum(t)!==null){keep.push(t);return;}
        const m=k==='qty'&&zen2han(t).match(/^(-?[\d.,]+)\s*([^\d.,\s]{1,4})$/);
        if(m){keep.push(m[1]);if(!unit)unit=m[2];}
        else desc=(desc+' '+t).trim();
      });
      L[k]=keep;
    }
  });
  let qty=num(L.qty),price=num(L.price),amount=num(L.amount);
  if(price===null&&amount!==null&&qty)price=Math.round(amount/qty*100)/100;
  if(qty===null&&price&&amount!==null){const q=amount/price;qty=Math.abs(q-Math.round(q))<0.01?Math.round(q):Math.round(q*100)/100;}
  return {desc,qty,unit,price,amount,memo};
}
// ヘッダーが見つからない場合：右から 金額・単価・数量 と読む
function guessLine(row){
  const cells=row.cells.map(c=>c.text);
  // 末尾の備考（数字でない短い文字）を外す
  let memo='';
  if(cells.length>2&&toNum(cells[cells.length-1])===null&&toNum(cells[cells.length-2])!==null){memo=cells.pop();}
  const nums=[];let unit='';
  while(cells.length&&nums.length<3){
    const t=cells[cells.length-1];
    const n=toNum(t);
    if(n!==null){nums.unshift(n);cells.pop();continue;}
    const m=zen2han(t).match(/^(-?[\d.,]+)\s*([^\d.,\s]{1,4})$/);
    if(m&&nums.length>=1){nums.unshift(toNum(m[1]));if(!unit)unit=m[2];cells.pop();continue;}
    // 単価と数量の間の単位
    if(!unit&&nums.length>=1&&t.length<=4&&cells.length>=2&&toNum(cells[cells.length-2])!==null){unit=t;cells.pop();continue;}
    break;
  }
  if(nums.length<2)return null;
  let qty=null,price,amount;
  if(nums.length===3)[qty,price,amount]=nums;else[price,amount]=nums;
  if(qty===null&&price){const q=amount/price;qty=Math.abs(q-Math.round(q))<0.01?Math.round(q):null;}
  const desc=cells.join(' ').trim();
  if(!desc||toNum(desc)!==null)return null;
  return {desc,qty,unit,price,amount,memo};
}
function parseQuoteRows(pages){
  const out=[];let cols=null;let found=false;
  pages.forEach(rows=>{
    let started=false;
    rows.forEach(row=>{
      const h=detectHeader(row);
      if(h){cols=h;started=true;found=true;return;}
      if(!cols||!started)return;
      const l=finishLine(rowToLine(row,cols));
      const hasNum=l.qty!==null||l.price!==null||l.amount!==null;
      if(!l.desc&&!hasNum)return;
      const isTotal=TOTAL_RE.test(l.desc.replace(/\s/g,''))&&(!l.qty||l.qty===1)&&l.price===null;
      if(!l.desc&&hasNum){ // 品名のない数値行：合計欄の可能性
        out.push({...l,kind:'total'});return;
      }
      out.push({...l,kind:isTotal?'total':hasNum?'item':'heading'});
    });
  });
  if(!found){
    pages.forEach(rows=>rows.forEach(row=>{const g=guessLine(row);if(g)out.push({...g,kind:TOTAL_RE.test(g.desc)?'total':'item'});}));
  }
  return {lines:out,headerFound:found};
}

function clipImage(e){
  const items=(e.clipboardData||{}).items||[];
  for(const it of items)if(it.kind==='file'&&/^image\//.test(it.type)){
    const b=it.getAsFile();if(!b)continue;
    const ext=(it.type.split('/')[1]||'png').replace('jpeg','jpg');
    const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}${String(d.getSeconds()).padStart(2,'0')}`;
    return new File([b],`スクショ_${stamp}.${ext}`,{type:it.type});
  }
  return null;
}

function impEdit(i,k,v){

// PDFは容量が大きいので、ブラウザの大きな保存領域（IndexedDB）に保存する
const FDB={db:null};
function fileDb(){
  if(FDB.db)return Promise.resolve(FDB.db);
  return new Promise((res,rej)=>{
    if(!window.indexedDB){rej(new Error('このブラウザではファイルを保存できません'));return;}
    const rq=indexedDB.open('takumi_files',2);
    rq.onupgradeneeded=()=>{const db=rq.result;
      if(!db.objectStoreNames.contains('files')){const st=db.createObjectStore('files',{keyPath:'id'});st.createIndex('projectId','projectId');}
      if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv');};
    rq.onsuccess=()=>{FDB.db=rq.result;res(rq.result);};
    rq.onerror=()=>rej(rq.error||new Error('ファイル保存領域を開けませんでした'));
  });
}
async function fdbTx(mode,fn){
  const db=await fileDb();
  return new Promise((res,rej)=>{
    const tx=db.transaction('files',mode);const st=tx.objectStore('files');
    let out;const r=fn(st);if(r)r.onsuccess=()=>{out=r.result;};
    tx.oncomplete=()=>res(out);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error||new Error('保存できませんでした（空き容量が足りない可能性があります）'));
  });
}
// このパソコンだけで使うときの保存先（IndexedDB）
const idbPutFile=rec=>fdbTx('readwrite',st=>st.put(rec));
const idbGetFile=id=>fdbTx('readonly',st=>st.get(id));
const idbDelFile=id=>fdbTx('readwrite',st=>st.delete(id));
const idbAllFiles=()=>fdbTx('readonly',st=>st.getAll());
const idbProjFiles=pid=>fdbTx('readonly',st=>st.index('projectId').getAll(pid));
// 共有フォルダ使用中はフォルダに、そうでなければこのパソコンに

async function kvSet(k,v){const db=await fileDb();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function kvDel(k){const db=await fileDb();return new Promise((res)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res();tx.onerror=()=>res();});}

  if(big.length){alert(`30MBを超えるファイルは保存できません：\n${big.map(f=>f.name).join('\n')}`);}

function readEstimateHeader(text){
  const lines=zen2han(text||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  const tight=l=>l.replace(/[\s　]/g,'');
  const own=tight(ISSUER.name||'');
  const o={no:'',date:'',client:'',title:'御中',subject:'',site:'',valid:'',inc:null};
  for(const l of lines){
    const t=tight(l);let m;
    if(!o.no&&(m=t.match(/見積(?:書)?(?:番号|No\.?|NO\.?|№)[:：]?([A-Za-z0-9\-]+)/)))o.no=m[1];
    if(!o.date&&/発行日|見積日|作成日|見積年月日|発行年月日/.test(t))o.date=parseJDate(l);
    if(!o.client&&(m=t.match(/^(.+?)(御中|様|殿)$/))&&!/工事|件名|場所|担当|下記/.test(m[1])&&!(own&&m[1].includes(own))){o.client=m[1];o.title=m[2]==='殿'?'様':m[2];}
    // 値は「：」の後ろから、大きな空白（別の欄）の手前まで
    const val=()=>{const i=l.search(/[:：]/);return i<0?'':l.slice(i+1).trim().split(/\s{2,}/)[0].trim();};
    if(!o.subject&&/(工事件名|工事名称|工事名|件名)[:：]/.test(t)){const v=val();if(v)o.subject=v;}
    if(!o.site&&/(工事場所|施工場所|現場住所|現場名|納入場所)[:：]/.test(t)){const v=val();if(v)o.site=v;}
    if(!o.valid&&/有効期限/.test(t))o.valid=parseJDate(l);
    if(o.inc===null&&/(単価|金額)\(?税抜|税別|外税/.test(t))o.inc=false;
    if(o.inc===null&&/(単価|金額)\(?税込|内税/.test(t))o.inc=true;
  }
  return o;
}

async function readPastFiles(input){
  const files=[...input.files];try{input.value='';}catch{}
  if(!files.length)return;
  const st=document.getElementById('past-status');
  for(let i=0;i<files.length;i++){
    const file=files[i];
    st.textContent=`読み取り中…（${i+1}/${files.length}）${file.name}`;
    try{PAST.items.push(await readPastOne(file,m=>{st.textContent=`（${i+1}/${files.length}）${m}`;}));}
    catch(e){console.error(e);PAST.items.push({file,error:String(e&&(e.message||e)),on:false});}
    renderPastTable();
  }
  st.textContent=`${files.length}件を読み取りました。内容を確認して「案件として登録」を押してください。`;
}
async function readPastOne(file,onStatus){
  const isPdf=/pdf/i.test(file.type)||/\.pdf$/i.test(file.name);
  let lines=[],text='',ocr=false;
  if(isPdf){
    const {pages,chars,pdf}=await pdfToRows(file);
    if(chars>=15){
      text=pages.map(rows=>rows.map(r=>r.cells.map(c=>c.text).join('  ')).join('\n')).join('\n');
      lines=parseQuoteRows(pages).lines;
    } else {
      ocr=true;onStatus('スキャンしたPDFのため、画像から読み取っています…');
      const r=await ocrQuoteFromPdf(pdf);if(r.tableFound)lines=classifyLines(r.lines);
      text=(await fileToText(file,onStatus)).text;
    }
  } else {
    ocr=true;onStatus('画像から読み取っています…');
    const r=await ocrTableFromGray(grayFromCanvas(await tableCanvasFromImage(file)));if(r.tableFound)lines=classifyLines(r.lines);
    text=(await fileToText(file,onStatus)).text;
  }
  if(!lines.some(l=>l.kind==='item'))lines=parsePlainLines(text);
  const h=readEstimateHeader(text);
  const sum=readDocSummary(text);
  // 明細（見出し行は品名だけの行として残す）
  const L=lines.filter(l=>l.kind==='item'||(l.kind==='heading'&&l.desc&&!/^備考/.test(l.desc.replace(/\s/g,''))))
    .map(l=>l.kind==='heading'?{desc:l.desc,qty:'',unit:'',unitPrice:'',memo:'',cost:''}
      :{desc:l.desc,qty:l.qty??'',unit:l.unit||'',unitPrice:l.price??'',memo:l.memo||'',cost:''});
  const sub=L.reduce((a,l)=>a+lineAmt(l),0);
  let inc=h.inc;
  if(inc===null&&sum.amount!==''){if(Math.round(sub)===sum.amount)inc=true;else if(Math.round(sub*1.1)===sum.amount)inc=false;}
  if(inc===null)inc=sum.inc!==null?sum.inc:true;
  return {file,on:true,ocr,h,lines:L,inc,totalPdf:sum.amount};
}
const pastTotal=it=>{const sub=it.lines.reduce((a,l)=>a+lineAmt(l),0);return it.inc?Math.round(sub):Math.round(sub)+Math.round(sub*0.1);};
function pastDup(it){
  if(!it.h.no)return null;
  for(const p of getProjects())for(const d of (p.docs||[]))if(d.docType==='estimate'&&String(d.no)===String(it.h.no))return p;
  return null;
}

function peStaffAdd(v){
  String(v||'').split(/[,、，\n]/).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean).forEach(n=>{if(!PE.staff.includes(n))PE.staff.push(n);});
  peStaffRender();
}
function peStaffFromInput(){const e=document.getElementById('pe-staff-in');if(!e)return;if(e.value.trim()){peStaffAdd(e.value);e.value='';}}

function getProjects(){const l=collGet('projects',PROJ_KEY);return shared()?l.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)):l;}
function saveProjects(list){collSave('projects',PROJ_KEY,list);}
function getProject(id){return getProjects().find(p=>p.id===id)||null;}
function putProject(proj){
  const list=getProjects();const i=list.findIndex(p=>p.id===proj.id);
  proj.updatedAt=Date.now();
  if(i>=0)list[i]=proj;else list.unshift(proj);
  saveProjects(list);
}
function newProjectNo(){
  const y=todayStr().slice(0,4);const key='takumi_proj_seq_'+y;
  // 2人で使っても重ならないよう、登録済みの案件番号の最大値からも計算
  const maxNo=getProjects().reduce((m,p)=>{const r=String(p.no||'').match(new RegExp('^K'+y+'-(\\d+)$'));return r?Math.max(m,+r[1]):m;},0);
  const n=Math.max(parseInt(localStorage.getItem(key)||'0')||0,maxNo)+1;
  localStorage.setItem(key,String(n));
  return `K${y}-${String(n).padStart(3,'0')}`;
}
function parseYen(v){
  v=String(v??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/[,，¥￥円\s]/g,'');
  return v===''?'':(parseInt(v,10)||0);
}
function statusBadge(k){
  const s=STATUSES.find(x=>x.k===k)||STATUSES[0];
  return `<span style="display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;color:${s.c};background:${s.bg};white-space:nowrap">${s.k}</span>`;
}
function fmtD(s){return s?s.replace(/-/g,'/'):'';}
const hasYen=v=>v!==''&&v!=null;
// 契約金額＝この案件の請求書の合計（請求書を作成・保存すると自動更新）
function invoiceSum(proj){return (proj.docs||[]).filter(d=>d.docType==='invoice').reduce((a,d)=>a+(d.total||0),0);}
function refreshContractActual(proj){
  const inv=(proj.docs||[]).filter(d=>d.docType==='invoice');
  proj.contractActual=inv.length?invoiceSum(proj):'';
}
// 案件の中で一番新しい見積書（発行済を優先）
function latestEstimate(proj){
  const est=(proj.docs||[]).filter(d=>d.docType==='estimate');
  if(!est.length)return null;
  est.sort((a,b)=>(b.status==='発行済')-(a.status==='発行済')||b.savedAt-a.savedAt);
  return est[0];
}

// 案件情報から帳票の入力内容を作る（見積の明細を引き継ぐ）
function prefillFromProject(proj,docType){
  const f=defaultF();
  if(!proj)return f;
  f.client=proj.client||'';f.clientTitle=proj.clientTitle||'様';f.clientAddr=proj.clientAddr||'';
  f.subject=proj.name||'';f.site=proj.site||'';
  if(docType==='delivery'&&proj.end)f.deliveryDate=proj.end;
  const est=latestEstimate(proj);
  if(est&&est.F&&Array.isArray(est.F.lines))f.lines=JSON.parse(JSON.stringify(est.F.lines));
  return f;
}
function setTaxUI(){
  document.getElementById('tax-inc').classList.toggle('active',S.taxType==='inc');
  document.getElementById('tax-exc').classList.toggle('active',S.taxType==='exc');
}
function clearDocForms(){Object.keys(docForms).forEach(k=>delete docForms[k]);}

function startDocFromProject(projId,docType,fromEst){
  autoSaveNow();
  const proj=getProject(projId);if(!proj)return;
  S.projectId=projId;clearDocForms();S.backTo='proj';
  S.docType=docType;
  const est=fromEst||latestEstimate(proj);
  if(est&&est.taxType)S.taxType=est.taxType;
  F=prefillFromProject(proj,docType);
  if(fromEst&&fromEst.F&&Array.isArray(fromEst.F.lines))F.lines=JSON.parse(JSON.stringify(fromEst.F.lines));
  setTaxUI();renderDocBtns();updateBadge();renderForm();refreshNoDisplay();
  setMainTab('form');
}
// 見積書から請求書をワンクリックで作成（明細・宛先・工事名を引き継ぐ）
function createInvoiceFromEstimate(projId,key){
  let proj=getProject(projId);if(!proj)return;
  if(!key){
    // 編集中の見積書：まず案件に保存してから
    saveDocToProject(proj,F.issued?'発行済':'下書き');
    key=F.docKey;proj=getProject(projId);
  }
  const est=(proj.docs||[]).find(d=>d.key===key);if(!est)return;
  startDocFromProject(projId,'invoice',est);
  saveDocToProject(getProject(projId),'下書き'); // 作成した時点で案件に記録（契約金額も更新）
  renderForm();refreshNoDisplay();
  alert(`見積書「${est.no}」から請求書を作成しました。\n内容を確認して、印刷・発行確定してください。`);
}
function openProjectDoc(projId,key,from){
  autoSaveNow();
  const proj=getProject(projId);if(!proj)return;
  const doc=(proj.docs||[]).find(d=>d.key===key);if(!doc)return;
  S.projectId=projId;clearDocForms();S.backTo=from||'proj';
  S.docType=doc.docType;S.taxType=doc.taxType||S.taxType;
  F=JSON.parse(JSON.stringify(doc.F));
  F.docKey=doc.key;F.noLocked=true;F.issued=doc.status==='発行済';
  setTaxUI();renderDocBtns();updateBadge();renderForm();refreshNoDisplay();
  setMainTab('form');
}
function unlinkProject(){
  if(!confirm('この書類と案件の紐づけを解除しますか？\n（すでに案件に記録された書類は残ります）'))return;
  saveFormState();S.projectId=null;F.docKey=null;renderForm();
}
// 現在の書類を案件に記録
function saveDocToProject(proj,status){
  saveFormState();
  if(!F.docKey)F.docKey='d'+Date.now()+Math.random().toString(36).slice(2,6);
  const totals=calcTotals();
  const docs=proj.docs||[];
  const i=docs.findIndex(d=>d.key===F.docKey);
  const rec={key:F.docKey,docType:S.docType,no:F.no,date:F.date,total:totals.total,taxType:S.taxType,
    status:(i>=0&&docs[i].status==='発行済')?'発行済':status,savedAt:Date.now(),F:JSON.parse(JSON.stringify(F))};
  if(i>=0)docs[i]=rec;else docs.push(rec);
  proj.docs=docs;
  // 見積書を保存・更新するたびに、契約予定金額（税込）を見積金額に合わせる
  if(S.docType==='estimate')proj.contract=rec.total;
  // 請求書を作成・更新したら、契約金額（請求書の合計）を更新
  if(S.docType==='invoice')refreshContractActual(proj);
  // 請求書を発行したら、ステータスを「請求済」まで進める（すでに先なら変えない）
  if(status==='発行済'&&S.docType==='invoice'&&statusOrder(proj.status)<statusOrder('請求済')&&proj.status!=='失注')proj.status='請求済';
  putProject(proj);
}

// 粗利（税抜）：予定＝見積の販売額−仕入額、実績＝請求書の合計−受領請求書の合計
function profitBox(p){
  const est=latestEstimate(p);
  const plan=est&&est.F?lineProfit(est.F.lines,est.taxType):null;
  const rc=rcvOfProject(p.id);
  const salesInc=hasYen(p.contractActual)?p.contractActual:null;
  const costEx=rc.reduce((a,r)=>a+(hasYen(r.tax)?(r.amount||0)-r.tax:Math.round((r.amount||0)/1.1)),0);
  const act=salesInc!==null?(()=>{const sales=Math.round(salesInc/1.1);const profit=sales-costEx;return {sales,cost:costEx,profit,rate:sales?Math.round(profit/sales*1000)/10:0};})():null;

function dashMonth(src,ym){
  const iv=src.inv.filter(x=>ymOf(x.d.date)===ym),rc=src.rcv.filter(r=>ymOf(r.date)===ym);
  const sales=iv.reduce((a,x)=>a+(x.d.total||0),0),salesEx=iv.reduce((a,x)=>a+exTax(x.d.total),0);
  const cost=rc.reduce((a,r)=>a+(r.amount||0),0),costEx=rc.reduce((a,r)=>a+rcvEx(r),0);

function dashChart(months){
  const pw=(document.getElementById('panel-dash')||{}).clientWidth||800;
  const W=Math.max(320,Math.min(1400,pw-62)),H=W<500?200:240,L=58,R=10,T=14,B=30,cw=(W-L-R)/months.length;
  const vals=months.flatMap(m=>[m.salesEx,m.costEx,m.profit]);
  let max=Math.max(1,...vals),min=Math.min(0,...vals);
  const step=(()=>{const r=(max-min)/4;const p=Math.pow(10,Math.floor(Math.log10(r)));return [1,2,2.5,5,10].map(k=>k*p).find(k=>k>=r);})();
  max=Math.ceil(max/step)*step;min=Math.floor(min/step)*step;
  const y=v=>T+(H-T-B)*(max-v)/(max-min);
  const man=v=>Math.abs(v)>=10000?(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})+'万':v.toLocaleString('ja-JP');
  let g='';
  for(let v=min;v<=max+1e-6;v+=step)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#bbb':'#eee'}"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="#999">${man(v)}</text>`;
  const bw=Math.max(4,Math.min(18,cw/3.2));
  months.forEach((m,i)=>{
    const cx=L+cw*i+cw/2;
    const bar=(v,x,c)=>`<rect x="${x}" y="${Math.min(y(v),y(0))}" width="${bw}" height="${Math.max(0.5,Math.abs(y(v)-y(0)))}" fill="${c}" rx="1.5"><title>${ymLabel(m.ym)} ${c==='#1e4a32'?'売上':'仕入'}（税抜）${fmtY(v)}</title></rect>`;
    g+=bar(m.salesEx,cx-bw-1,'#1e4a32')+bar(m.costEx,cx+1,'#c9b26b');
    g+=`<text x="${cx}" y="${H-B+15}" text-anchor="middle" font-size="${cw<34?9:10.5}" fill="${i===months.length-1?'#1e4a32':'#888'}" font-weight="${i===months.length-1?700:400}">${+m.ym.slice(5)}月</text>`;
  });
  const pts=months.map((m,i)=>`${L+cw*i+cw/2},${y(m.profit)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="#d35400" stroke-width="2"/>`+months.map((m,i)=>`<circle cx="${L+cw*i+cw/2}" cy="${y(m.profit)}" r="3.2" fill="#fff" stroke="#d35400" stroke-width="2"><title>${ymLabel(m.ym)} 粗利 ${fmtY(m.profit)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>`;
}

// 受領請求書：読み取った内容を入力欄に入れる
let RCV_FILE=null;
function rcvApply(sum,ocr){
  const set=(k,v,onlyEmpty)=>{const e=document.getElementById('re-'+k);if(!e||v===''||v==null)return false;if(onlyEmpty&&e.value.trim())return false;e.value=v;e.style.background='#fffbe6';return true;};
  const got=[];
  if(sum.amount!==''){
    // 税抜の金額しか分からないときは税込に直す
    const inc=sum.inc===false?Math.round(sum.amount*1.1):sum.amount;
    if(set('amount',inc))got.push('金額'+(sum.inc===false?'（税抜→税込に換算）':''));
  }
  if(sum.tax!==''&&set('tax',sum.tax))got.push('消費税');
  if(set('due',sum.due))got.push('支払期限');
  if(set('date',sum.date))got.push('請求日');
  if(set('no',sum.no,true))got.push('請求書番号');
  if(set('vendor',sum.vendor,true))got.push('請求元');
  const st=document.getElementById('re-status');
  st.innerHTML=got.length?`<span style="color:#1e4a32">✓ ${got.join('・')} を入れました（黄色の欄）。内容を確認してから保存してください。</span>${ocr?'<br><span style="color:#b86e00">画像から読み取ったため、数字の読み間違いに注意してください。</span>':''}`

async function rcvReadFile(input){
  const file=input.files[0];try{input.value='';}catch{}if(!file)return;
  RCV_FILE=file;
  const st=document.getElementById('re-status');st.textContent='読み取り中…';
  try{const {text,ocr}=await fileToText(file,m=>{st.textContent=m;});rcvApply(readDocSummary(text),ocr);
    st.innerHTML+=`<br><span style="color:#888">📎 ${esc(file.name)}：保存すると、選んだ案件の「もらった書類」にも保存されます</span>`;}
  catch(e){console.error(e);const msg=String(e&&(e.message||e));
    st.innerHTML=`<span style="color:#c0392b">${/Worker|SecurityError|blob/i.test(msg)?'この画面では画像から文字を読み取れません。ChromeかEdgeで開き直してください。':esc(msg)}</span>`;}
}

function saveRcvEditor(id,btn){
  const v=k=>((document.getElementById('re-'+k)||{}).value||'').trim();
  if(!v('vendor')){alert('請求元を入力してください');return;}
  const amount=parseYen(v('amount'));
  if(amount===''){alert('金額を入力してください');return;}
  const list=getReceived();
  const r=id?list.find(x=>x.id===id):{id:'r'+Date.now(),createdAt:Date.now()};
  Object.assign(r,{vendor:v('vendor'),no:v('no'),date:v('date'),due:v('due'),amount,tax:parseYen(v('tax')),
    projectId:v('projectId'),payStatus:v('payStatus')||'未払',paidDate:v('paidDate'),memo:v('memo')});
  // 読み取りに使ったPDF・写真を案件に保存して、受領請求書から開けるようにする
  if(RCV_FILE&&r.projectId){
    const f=RCV_FILE;
    saveProjFile(r.projectId,f,{kind:'receivedInvoice',vendor:r.vendor}).then(rec=>{
      const l=getReceived();const x=l.find(y=>y.id===r.id);if(x){x.fileId=rec.id;saveReceived(l);}

// ===================== バックアップ（全データ） =====================
async function exportAll(){
  const seq={};
  let files=[];
  try{
    const all=await allFiles();
    for(const f of all){const {blob,...meta}=f;files.push({...meta,data:await blobToDataURL(blob)});}
  }catch(e){console.warn(e);}
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(/^(hanhyo_seq_|takumi_proj_seq_)/.test(k))seq[k]=localStorage.getItem(k);}
  const data={app:'案件管理・帳票作成ツール',version:2,exportedAt:new Date().toISOString(),
    projects:getProjects(),customers:getCustomers(),received:getReceived(),issuer:shared()?SH.issuer:JSON.parse(localStorage.getItem(ISSUER_KEY)||'null'),seq,files};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'}));
  a.download=`案件管理・帳票作成ツール_バックアップ_${todayStr()}.json`;
  document.body.appendChild(a);a.click();a.remove();
}
async function importAll(input){
  const file=input.files[0];input.value='';if(!file)return;
  let data;
  try{data=JSON.parse(await file.text());}catch{alert('バックアップファイルを読み込めませんでした');return;}
  const projs=Array.isArray(data)?data:(data.projects||[]);
  const custs=data.customers||[];
  if(!confirm(`バックアップから復元します。\n案件 ${projs.length}件・顧客 ${custs.length}件・受領請求書 ${(data.received||[]).length}件・ファイル ${(data.files||[]).length}件${data.issuer?'・自社情報':''}\n同じデータはバックアップの内容で上書きします。`))return;
  const merge=(cur,inc)=>{inc.forEach(x=>{const i=cur.findIndex(y=>y.id===x.id);if(i>=0)cur[i]=x;else cur.push(x);});return cur;};
  saveProjects(merge(getProjects(),projs));
  saveCustomers(merge(getCustomers(),custs));
  saveReceived(merge(getReceived(),data.received||[]));
  try{for(const f of (data.files||[])){const {data:u,...meta}=f;await putFile({...meta,blob:await dataURLToBlob(u)});}}
  catch(e){alert('ファイルの一部を復元できませんでした：'+(e.message||e));}
  if(data.issuer){if(shared())saveIssuerShared(data.issuer);else localStorage.setItem(ISSUER_KEY,JSON.stringify(data.issuer));loadIssuer();updateBadge();}
  // 連番は大きい方を残す（番号の重複防止）
  Object.entries(data.seq||{}).forEach(([k,v])=>{if((parseInt(v)||0)>(parseInt(localStorage.getItem(k))||0))localStorage.setItem(k,v);});
  alert('復元しました');setMainTab(S.mainTab==='form'||S.mainTab==='preview'?'proj':S.mainTab);
}

// --- 一覧データ（共有中はフォルダの内容、そうでなければこのパソコン） ---
function collGet(c,lsKey){
  if(shared())return [...SH.cache[c].values()].map(clone);
  try{return JSON.parse(localStorage.getItem(lsKey)||'[]');}catch{return [];}
}
function collSave(c,lsKey,list){
  if(!shared()){localStorage.setItem(lsKey,JSON.stringify(list));return;}
  const next=new Map(list.map(o=>[o.id,o]));
  for(const [id,o] of next){
    const prev=SH.cache[c].get(id);
    if(!prev||JSON.stringify(prev)!==JSON.stringify(o)){
      SH.cache[c].set(id,clone(o));const k=c+'/'+id;SH.pendingIds.add(k);
      shEnqueue(()=>shWriteRec(c,SH.cache[c].get(id))).finally(()=>SH.pendingIds.delete(k));
    }
  }
  for(const id of [...SH.cache[c].keys()])if(!next.has(id)){SH.cache[c].delete(id);shEnqueue(()=>shDelRec(c,id));}
}

// --- フォルダの読み書き ---
async function shDir(path,create=true){let d=SH.dir;for(const seg of path.split('/').filter(Boolean))d=await d.getDirectoryHandle(seg,{create});return d;}
async function shWriteFile(dirPath,name,data){
  const d=await shDir(dirPath);const fh=await d.getFileHandle(name,{create:true});
  const w=await fh.createWritable();await w.write(data);await w.close();
  return (await fh.getFile()).lastModified;
}
async function shReadFile(dirPath,name){const d=await shDir(dirPath,false);return (await d.getFileHandle(name)).getFile();}
async function shRemove(dirPath,name){try{const d=await shDir(dirPath,false);await d.removeEntry(name);}catch(e){if(e&&e.name!=='NotFoundError')throw e;}}
async function shScan(c){
  const d=await shDir('data/'+c);const out=[];
  for await(const [name,h] of d.entries()){if(h.kind==='file'&&name.endsWith('.json'))out.push([name.slice(0,-5),await h.getFile()]);}
  return out;
}
function shEnqueue(job){
  SH.pending++;shStatus();
  SH.queue=SH.queue.then(job).then(()=>{SH.err='';}).catch(e=>{
    console.error(e);SH.err=(e&&e.message)||String(e);
    alert(SH.backend==='cloud'?'保存に失敗しました。インターネット接続を確認してください。\n'+SH.err:'共有フォルダへの保存に失敗しました。\n'+SH.err+'\n\nGoogleドライブが動いているか確認してください。');
  }).finally(()=>{SH.pending--;SH.lastSync=Date.now();shStatus();});
  return SH.queue;
}
// 同じ案件を2人がほぼ同時に保存したとき：帳票は両方を残し（新しい方を優先）、他の項目は保存した側を採用
function mergeProject(mine,disk){
  const docs=new Map();
  [...(disk.docs||[]),...(mine.docs||[])].forEach(d=>{const o=docs.get(d.key);if(!o||(d.savedAt||0)>=(o.savedAt||0))docs.set(d.key,d);});
  const m={...mine,docs:[...docs.values()]};
  refreshContractActual(m);return m;
}
async function shWriteRec(c,o){
  if(!o)return;
  if(SH.backend==='cloud')return cloudWriteRec(c,o);
  if(c==='projects'){
    try{
      const f=await shReadFile('data/projects',o.id+'.json');const known=SH.mtime['projects/'+o.id];
      if(known!==undefined&&f.lastModified>known){o=mergeProject(o,JSON.parse(await f.text()));SH.cache.projects.set(o.id,o);}
    }catch{}
  }
  SH.mtime[c+'/'+o.id]=await shWriteFile('data/'+c,o.id+'.json',JSON.stringify(o,null,1));
}
async function shDelRec(c,id){
  if(SH.backend==='cloud')return cloudDelRec(c,id);
  if(c==='files'){const m=SH.cache.files.get(id);if(m)await shRemove('files/'+m.projectId,m.path);}
  await shRemove('data/'+c,id+'.json');delete SH.mtime[c+'/'+id];
}
// --- ファイル（PDFなど）：本体は files/案件ID/ に、情報は data/files/ に ---
async function shPutFile(rec){
  const {blob,...meta}=rec;
  const cloud=SH.backend==='cloud';
  // クラウドは日本語のファイル名を保存先に使えないので、案件ID/ファイルID にする
  meta.path=cloud?(meta.projectId+'/'+meta.id):(meta.path&&!meta.path.includes('/')?meta.path:(meta.id+'__'+safeName(meta.name)));
  SH.cache.files.set(meta.id,clone(meta));
  return shEnqueue(async()=>{
    if(blob){
      if(cloud){const {error}=await SH.sb.storage.from('files').upload(meta.path,blob,{upsert:true,contentType:meta.type||'application/octet-stream'});if(error)throw new Error('ファイルを保存できませんでした：'+error.message);}
      else await shWriteFile('files/'+meta.projectId,meta.path,blob);
    }
    await shWriteRec('files',SH.cache.files.get(meta.id));
  });
}
async function shGetFile(id){
  const m=SH.cache.files.get(id);if(!m)return null;
  if(SH.backend==='cloud'){
    const {data,error}=await SH.sb.storage.from('files').download(m.path);
    if(error||!data)throw new Error('ファイルを読み込めませんでした。'+(error?error.message:''));
    return {...clone(m),blob:data};
  }
  try{const blob=await shReadFile('files/'+m.projectId,m.path);return {...clone(m),blob};}
  catch{throw new Error('ファイル本体が見つかりません。Googleドライブの同期が終わるまで少し待ってから、もう一度お試しください。');}
}
async function shDelFile(id){
  const m=SH.cache.files.get(id);SH.cache.files.delete(id);if(!m)return;
  if(SH.backend==='cloud'){await shEnqueue(async()=>{await SH.sb.storage.from('files').remove([m.path]);await cloudDelRec('files',id);});return;}
  await shEnqueue(async()=>{await shRemove('files/'+m.projectId,m.path);await shRemove('data/files',id+'.json');delete SH.mtime['files/'+id];});
}
async function shAllFiles(){const out=[];for(const id of SH.cache.files.keys()){try{const f=await shGetFile(id);if(f)out.push(f);}catch{}}return out;}
function saveIssuerShared(obj){
  SH.issuer=clone(obj);
  if(SH.backend==='cloud'){shEnqueue(()=>cloudUpsert('settings','issuer',SH.issuer));return;}
  shEnqueue(async()=>{SH.issuerMtime=await shWriteFile('data/settings','issuer.json',JSON.stringify(SH.issuer));});
}

// --- 全部読み込み・定期的な読み直し ---
async function shLoadAll(){
  for(const c of SH_COLLS){
    const m=new Map();
    for(const [base,f] of await shScan(c)){
      try{const o=JSON.parse(await f.text());if(!o||!o.id||base!==o.id)continue;m.set(o.id,o);SH.mtime[c+'/'+o.id]=f.lastModified;}catch{}
    }
    SH.cache[c]=m;
  }
  await shReadSettings();
}
async function shReadSettings(){
  let changed=false;
  try{const f=await shReadFile('data/settings','issuer.json');if(f.lastModified!==SH.issuerMtime){SH.issuer=JSON.parse(await f.text());SH.issuerMtime=f.lastModified;changed=true;}}
  catch{if(SH.issuer&&SH.issuerMtime){SH.issuer=null;SH.issuerMtime=0;changed=true;}}
  try{SH.remoteVer=(JSON.parse(await (await shReadFile('data/settings','app.json')).text())||{}).version||'';}catch{SH.remoteVer='';}
  return changed;
}
async function shPoll(manual){
  if(!shared())return;
  if(SH.backend==='cloud')return cloudPoll(manual);
  if(manual){SH.checking=true;shStatus();}
  if(SH.busy||SH.pending){
    if(manual){await SH.queue;await new Promise(r=>setTimeout(r,300));if(SH.busy){SH.checking=false;shStatus();return;}}
    else return;
  }
  SH.busy=true;let changed=false;const before=SH.cache.projects.size;
  try{
    for(const c of SH_COLLS){
      const seen=new Set();
      for(const [base,f] of await shScan(c)){
        seen.add(base);
        if(SH.mtime[c+'/'+base]===f.lastModified)continue;
        try{
          const o=JSON.parse(await f.text());if(!o||!o.id)continue;
          if(base!==o.id){
            // Googleドライブが作った「…(1).json」のような重複：案件なら統合して片付ける
            if(c==='projects'&&SH.cache.projects.has(o.id)){
              const merged=mergeProject(SH.cache.projects.get(o.id),o);SH.cache.projects.set(o.id,merged);
              shEnqueue(async()=>{await shWriteRec('projects',SH.cache.projects.get(o.id));await shRemove('data/projects',base+'.json');});changed=true;
            }
            continue;
          }
          SH.cache[c].set(o.id,o);SH.mtime[c+'/'+o.id]=f.lastModified;changed=true;
        }catch{}
      }
      for(const id of [...SH.cache[c].keys()])
        if(!seen.has(id)&&SH.mtime[c+'/'+id]!==undefined){SH.cache[c].delete(id);delete SH.mtime[c+'/'+id];changed=true;}
    }
    if(await shReadSettings())changed=true;
    SH.err='';SH.lastSync=Date.now();
  }catch(e){console.warn(e);SH.err=(e&&e.message)||String(e);}
  finally{SH.busy=false;}
  if(changed||SH.dirty)onSharedChange();
  SH.lastCheck=Date.now();SH.checking=false;
  if(manual){
    const diff=SH.cache.projects.size-before;
    SH.lastMsg=SH.err?'':changed?`新しい変更を反映しました${diff>0?`（案件が${diff}件増えました）`:''}`:'変更はありませんでした';
    setTimeout(()=>{SH.lastMsg='';shStatus();},8000);
  }
  shVersionCheck();shStatus();
}
