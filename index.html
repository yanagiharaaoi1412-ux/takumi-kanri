// 相手の変更を画面に反映（入力中・ダイアログ表示中は待つ）
function onSharedChange(){
  loadIssuer();updateBadge();
  const a=document.activeElement;
  const typing=a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(anyModalOpen()||typing){SH.dirty=true;return;}
  SH.dirty=false;
  const t=S.mainTab;
  if(t==='proj')renderProjects();
  else if(t==='dash')renderDash();

  else if(t==='received')renderReceived();
  else if(t==='master'&&(MS.tab==='cust'||MS.tab==='acct'))renderMaster();
}

  let dir;
  try{dir=await window.showDirectoryPicker({id:'takumi-shared',mode:'readwrite'});}
  catch(e){if(e&&e.name==='AbortError')return;alert('フォルダを開けませんでした：'+(e.message||e));return;}
  await startShared(dir,true);
}
async function startShared(dir,fresh){
  const prev={dir:SH.dir,mode:SH.mode};
  SH.dir=dir;
  try{await shDir('data/settings');for(const c of SH_COLLS)await shDir('data/'+c);await shDir('files');}
  catch(e){SH.dir=prev.dir;alert('このフォルダに書き込めません。\n'+(e.message||e));return;}
  try{await shLoadAll();}catch(e){SH.dir=prev.dir;alert('共有フォルダを読み込めませんでした。\n'+(e.message||e));return;}
  SH.mode='folder';
  if(fresh){
    try{await kvSet('sharedDir',dir);}catch{}
    await offerMigration();
    // フォルダの説明書き
    shEnqueue(()=>shWriteFile('','このフォルダについて.txt','案件管理・帳票作成ツールの共有データです。\r\n中のファイルは手で編集・削除しないでください。\r\n「data」に案件などの情報、「files」にもらった見積書などのファイルが入っています。\r\n'));
  }
  localStorage.setItem('takumi_mode','folder');
  if(!SH.remoteVer||SH.remoteVer<APP_VERSION){SH.remoteVer=APP_VERSION;shEnqueue(()=>shWriteFile('data/settings','app.json',JSON.stringify({version:APP_VERSION})));}
  hideConnectOverlay();
  loadIssuer();updateBadge();
  clearInterval(SH.timer);SH.timer=setInterval(shPoll,15000);
  SH.lastSync=Date.now();SH.lastCheck=Date.now();shStatus();shVersionCheck();
  if(S.mainTab==='form'||S.mainTab==='preview'){S.projectId=null;}
  setMainTab(S.mainTab==='form'||S.mainTab==='preview'?'proj':S.mainTab);
}
// このパソコンのデータを共有フォルダへ（ない分だけ追加）
async function offerMigration(){
  const ls=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]');}catch{return [];}};
  const lp=ls(PROJ_KEY).filter(x=>!SH.cache.projects.has(x.id));
  const lc=ls(CUST_KEY).filter(x=>!SH.cache.customers.has(x.id));
  const lr=ls(RCV_KEY).filter(x=>!SH.cache.received.has(x.id));
  let lf=[];try{lf=(await idbAllFiles()).filter(x=>!SH.cache.files.has(x.id));}catch{}
  let li=null;try{li=JSON.parse(localStorage.getItem(ISSUER_KEY)||'null');}catch{}
  const needIssuer=li&&!SH.issuer;
  if(!lp.length&&!lc.length&&!lr.length&&!lf.length&&!needIssuer)return;
  const fc=SH.cache.projects.size;
  const msg=`このパソコンに保存されているデータを、共有フォルダに${fc?'追加':'コピー'}しますか？\n\n`+
    `案件 ${lp.length}件・顧客 ${lc.length}件・受領請求書 ${lr.length}件・ファイル ${lf.length}件${needIssuer?'・自社情報':''}\n`+
    (fc?`\n（共有フォルダには既に案件が${fc}件あります。そこに追加します）\n`:'')+
    `\n※このパソコンのデータは消さずに残します。`;
  if(!confirm(msg))return;
  const merge=(cur,add)=>[...cur,...add];
  saveProjects(merge(getProjects(),lp));
  saveCustomers(merge(getCustomers(),lc));
  saveReceived(merge(getReceived(),lr));
  for(const f of lf)await shPutFile(f);
  if(needIssuer)saveIssuerShared(li);
  await SH.queue;
}
async function disconnectShared(){
  if(!confirm('共有フォルダの使用をやめて、このパソコンだけのデータに戻しますか？\n（共有フォルダのデータはそのまま残ります。Aさんなど他の人には影響しません）'))return;
  clearInterval(SH.timer);SH.mode='local';SH.dir=null;
  localStorage.removeItem('takumi_mode');try{await kvDel('sharedDir');}catch{}
  loadIssuer();updateBadge();shStatus();shVersionCheck();
  S.projectId=null;setMainTab('proj');
}
// 起動時：前回の共有フォルダに自動で接続（許可が必要なときはボタンを表示）
async function initShared(){
  if(CLOUD.url)return cloudInit();
  shStatus();
  if(localStorage.getItem('takumi_mode')!=='folder')return;
  let dir=null;try{dir=await kvGet('sharedDir');}catch{}
  if(!dir){localStorage.removeItem('takumi_mode');shStatus();return;}
  let perm='prompt';try{perm=await dir.queryPermission({mode:'readwrite'});}catch{}
  if(perm==='granted'){await startShared(dir,false);return;}
  SH.pendingDir=dir;showConnectOverlay(dir.name);

async function reconnectShared(){
  const dir=SH.pendingDir;if(!dir)return;

  if(p==='granted'){SH.pendingDir=null;await startShared(dir,false);}
  else alert('フォルダへのアクセスが許可されませんでした。');
}

const SB_LIB='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const ts=v=>v?Date.parse(v):0;
async function cloudClient(){
  if(SH.sb)return SH.sb;
  if(window.__sbFake){SH.sb=window.__sbFake;return SH.sb;}   // テスト用
  const lib=await import(SB_LIB);
  SH.sb=lib.createClient(CLOUD.url,CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true}});
  return SH.sb;
}
async function cloudInit(){
  SH.backend='cloud';
  showCloudOverlay('loading');
  try{await cloudClient();}
  catch(e){showCloudOverlay('error','インターネットに接続できないため、ツールを開けません。接続を確認して、ページを再読み込みしてください。');return;}
  const {data}=await SH.sb.auth.getSession();
  if(data&&data.session){SH.user=data.session.user;await cloudStart();}
  else showCloudOverlay('login');
}
async function cloudLogin(){
  const em=document.getElementById('cl-email').value.trim(),pw=document.getElementById('cl-pass').value;
  const msg=document.getElementById('cl-msg');
  if(!em||!pw){msg.textContent='メールアドレスとパスワードを入力してください';return;}
  msg.textContent='ログイン中…';
  const {data,error}=await SH.sb.auth.signInWithPassword({email:em,password:pw});
  if(error){msg.textContent=/invalid/i.test(error.message)?'メールアドレスかパスワードが違います':'ログインできませんでした：'+error.message;return;}
  SH.user=data.user;await cloudStart();
}
async function cloudLogout(){
  if(SH.pending&&!confirm('保存中のデータがあります。ログアウトしますか？'))return;
  await SH.sb.auth.signOut();location.reload();
}
async function cloudSelectAll(){
  const rows=[];const N=1000;
  for(let from=0;;from+=N){
    const {data,error}=await SH.sb.from('records').select('coll,id,data,updated_at').order('coll').order('id').range(from,from+N-1);
    if(error)throw new Error(error.message);
    rows.push(...data);if(data.length<N)break;
  }
  return rows;
}
// 読み込んだ全データを手元に反映（変化があれば true）
function cloudApplyAll(rows){
  let changed=false;const seen={projects:new Set(),customers:new Set(),received:new Set(),files:new Set()};
  let issuer=null,ver='';
  for(const r of rows){
    if(r.coll==='settings'){if(r.id==='issuer')issuer=r.data;if(r.id==='app')ver=(r.data||{}).version||'';
      if(r.id==='roles'&&JSON.stringify(SH.roles)!==JSON.stringify(r.data)){SH.roles=r.data;changed=true;}
      if(r.id.startsWith('member:')){const uid=r.id.slice(7);if(JSON.stringify(SH.members[uid])!==JSON.stringify(r.data)){SH.members[uid]=r.data;changed=true;}}
      continue;}
    if(!SH.cache[r.coll])continue;
    seen[r.coll].add(r.id);
    const k=r.coll+'/'+r.id;
    if(SH.pendingIds.has(k))continue;
    if(SH.mtime[k]===ts(r.updated_at))continue;
    const cur=SH.cache[r.coll].get(r.id);
    if(!cur||JSON.stringify(cur)!==JSON.stringify(r.data)){SH.cache[r.coll].set(r.id,r.data);changed=true;}
    SH.mtime[k]=ts(r.updated_at);
  }
  for(const c of SH_COLLS)for(const id of [...SH.cache[c].keys()])
    if(!seen[c].has(id)&&!SH.pendingIds.has(c+'/'+id)&&SH.mtime[c+'/'+id]!==undefined){SH.cache[c].delete(id);delete SH.mtime[c+'/'+id];changed=true;}
  if(JSON.stringify(issuer)!==JSON.stringify(SH.issuer)){SH.issuer=issuer;changed=true;}
  SH.remoteVer=ver;
  return changed;
}
async function cloudStart(){
  showCloudOverlay('loading','データを読み込んでいます…');
  try{cloudApplyAll(await cloudSelectAll());}
  catch(e){showCloudOverlay('error','データを読み込めませんでした。\n'+(e.message||e));return;}
  // はじめてログインしたアカウントは、苗字と名前を登録してから使う
  if(!myMember()){showCloudOverlay('name');return;}
  cloudStart2();
}
function myMember(){const m=SH.user&&SH.members[SH.user.id];return m&&m.lastName&&m.firstName?m:null;}
function myName(){const m=myMember();return m?m.lastName+' '+m.firstName:'';}
async function cloudSaveName(){
  const ln=document.getElementById('cl-last').value.replace(/\s+/g,'').trim(),fn=document.getElementById('cl-first').value.replace(/\s+/g,'').trim();
  const msg=document.getElementById('cl-msg');
  if(!ln||!fn){msg.textContent='苗字と名前の両方を入力してください';return;}
  msg.style.color='#666';msg.textContent='保存中…';
  const first=!SH.started;
  const rec={uid:SH.user.id,email:SH.user.email||'',lastName:ln,firstName:fn,updatedAt:Date.now()};
  try{await cloudUpsert('settings','member:'+SH.user.id,rec);}
  catch(e){msg.style.color='#c0392b';msg.textContent='保存できませんでした：'+(e.message||e);return;}
  SH.members[SH.user.id]=rec;
  if(first)cloudStart2();else{hideConnectOverlay();shStatus();if(S.mainTab==='proj')renderProjects();}
}
function cloudStart2(){
  SH.started=true;
  SH.mode='folder';   // 共有モード（保存先はクラウド）
  // 相手の変更をすぐ受け取る
  try{
    SH.sb.channel('records-live').on('postgres_changes',{event:'*',schema:'public',table:'records'},cloudOnChange)
      .subscribe(st=>{SH.live=(st==='SUBSCRIBED');shStatus();});
  }catch(e){console.warn(e);}
  if(!SH.remoteVer||SH.remoteVer<APP_VERSION){SH.remoteVer=APP_VERSION;shEnqueue(()=>cloudUpsert('settings','app',{version:APP_VERSION}));}
  hideConnectOverlay();
  loadIssuer();updateBadge();
  clearInterval(SH.timer);SH.timer=setInterval(()=>cloudPoll(false),60000);  // 念のため1分ごとにも確認
  SH.lastCheck=Date.now();shStatus();shVersionCheck();
  S.projectId=null;setMainTab('proj');
  if(!SH.issuer)setTimeout(()=>{
    if(confirm('自社情報（会社名・振込先・ロゴ・角印）がまだ登録されていません。\n「自社情報ファイル」かバックアップから読み込むか、マスタ登録 → 自社情報 で登録してください。\n\n今すぐマスタ登録を開きますか？')){MS.tab='self';setMainTab('master');}
  },300);
}
function cloudOnChange(p){
  const row=p.eventType==='DELETE'?p.old:p.new;
  if(!row||!row.coll||!row.id)return;
  const c=row.coll,id=row.id,k=c+'/'+id;
  if(c==='settings'){
    if(id==='issuer'){SH.issuer=p.eventType==='DELETE'?null:row.data;}
    if(id==='app'&&row.data){SH.remoteVer=row.data.version||'';shVersionCheck();}
    if(id==='roles')SH.roles=p.eventType==='DELETE'?null:row.data;
    if(id.startsWith('member:')){const uid=id.slice(7);if(p.eventType==='DELETE')delete SH.members[uid];else SH.members[uid]=row.data;}
    SH.lastCheck=Date.now();onSharedChange();shStatus();return;
  }
  if(!SH.cache[c]||SH.pendingIds.has(k))return;
  if(p.eventType==='DELETE'){if(!SH.cache[c].has(id))return;SH.cache[c].delete(id);delete SH.mtime[k];}
  else{
    SH.mtime[k]=ts(row.updated_at);
    const cur=SH.cache[c].get(id);
    if(cur&&JSON.stringify(cur)===JSON.stringify(row.data))return;   // 自分の保存の通知
    SH.cache[c].set(id,row.data);
  }
  SH.lastCheck=Date.now();onSharedChange();shStatus();
}
async function cloudUpsert(c,id,data){
  const {data:r,error}=await SH.sb.from('records').upsert({coll:c,id,data},{onConflict:'coll,id'}).select('updated_at').single();
  if(error)throw new Error(error.message);
  SH.mtime[c+'/'+id]=ts(r&&r.updated_at);
}
async function cloudWriteRec(c,o){
  if(c==='projects'){
    // 相手が先に同じ案件を保存していたら、帳票を統合してから保存
    const {data:cur}=await SH.sb.from('records').select('data,updated_at').eq('coll','projects').eq('id',o.id).maybeSingle();
    const known=SH.mtime['projects/'+o.id];
    if(cur&&known!==undefined&&ts(cur.updated_at)>known){o=mergeProject(o,cur.data);SH.cache.projects.set(o.id,o);}
  }
  await cloudUpsert(c,o.id,o);
}
async function cloudDelRec(c,id){
  const {error}=await SH.sb.from('records').delete().eq('coll',c).eq('id',id);
  if(error)throw new Error(error.message);
  delete SH.mtime[c+'/'+id];
}
async function cloudPoll(manual){
  if(manual){SH.checking=true;shStatus();}
  if(SH.busy){if(manual){SH.checking=false;shStatus();}return;}
  SH.busy=true;let changed=false;const before=SH.cache.projects.size;
  try{if(manual)await SH.queue;changed=cloudApplyAll(await cloudSelectAll());SH.err='';}
  catch(e){SH.err=(e&&e.message)||String(e);}
  finally{SH.busy=false;}
  if(changed||SH.dirty)onSharedChange();
  SH.lastCheck=Date.now();SH.checking=false;
  if(manual){
    const diff=SH.cache.projects.size-before;
    SH.lastMsg=SH.err?'':changed?`新しい変更を反映しました${diff>0?`（案件が${diff}件増えました）`:''}`:'変更はありませんでした';
    setTimeout(()=>{SH.lastMsg='';shStatus();},8000);
  }
  shVersionCheck();shStatus();
}
function cloudStatus(el){
  const st=SH.err?`<span style="color:#c0392b">⚠ ${esc(SH.err).slice(0,60)}</span>`:SH.checking?'<span style="color:#b86e00">⟳ 確認中…</span>':SH.pending?'<span style="color:#b86e00">保存中…</span>':'<span style="color:#1e4a32">✓ 保存済み</span>';
  const t=SH.lastCheck?new Date(SH.lastCheck):null;
  const hm=t?`${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}`:'—';
  el.innerHTML=`<div style="font-size:10.5px;line-height:1.6;margin-bottom:6px;color:#555">👤 <b>${esc(myName()||'（名前未登録）')}</b>${adminIds().includes(SH.user&&SH.user.id)?' <span style="font-size:9.5px;background:#1e4a32;color:#fff;border-radius:3px;padding:0 4px">管理者</span>':''} <a href="#" onclick="showCloudOverlay('name');return false" style="font-size:10px;color:#888">変更</a><br>☁ ${esc(SH.user&&SH.user.email||'')}<br>
      ${st}　<span style="color:#888">案件 ${SH.cache.projects.size}件</span><br>
      <span style="color:#999">${SH.live?'● リアルタイム反映中':'最終確認 '+hm}</span></div>
    ${SH.lastMsg?`<div style="font-size:10.5px;color:#1e4a32;background:#eef5f0;border-radius:4px;padding:3px 6px;margin-bottom:6px">${esc(SH.lastMsg)}</div>`:''}
    <button class="btn" style="width:100%;font-size:11px;margin-bottom:4px" onclick="shPoll(true)" ${SH.checking?'disabled':''}>${SH.checking?'⟳ 確認中…':'⟳ 今すぐ更新'}</button>
    <a href="#" onclick="cloudLogout();return false" style="font-size:10px;color:#aaa">ログアウト</a>`;
}
function showCloudOverlay(kind,text){
  let el=document.getElementById('sh-overlay');
  if(!el){el=document.createElement('div');el.id='sh-overlay';document.body.appendChild(el);}
  const box=inner=>`<div style="position:fixed;inset:0;background:#f5f5f5;z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px">
    <div style="background:#fff;border:1px solid #d5e3d9;border-radius:12px;padding:26px 28px;width:380px;max-width:100%;box-shadow:0 8px 32px rgba(0,0,0,.06)">
      <div style="font-size:15px;font-weight:700;color:#1e4a32;margin-bottom:4px">${esc(ISSUER.name||'')}</div>
      <div style="font-size:11px;color:#999;margin-bottom:16px">案件管理・帳票作成ツール</div>${inner}</div></div>`;
  if(kind==='name'){
    const m=(SH.user&&SH.members[SH.user.id])||{};const again=!!SH.started;
    el.innerHTML=box(`
      <div style="font-size:13px;font-weight:700;color:#333;margin-bottom:4px">${again?'お名前の変更':'お名前の登録'}</div>
      <div style="font-size:11.5px;color:#777;line-height:1.6;margin-bottom:12px">${again?'':'はじめてのログインです。'}このアカウント（${esc(SH.user&&SH.user.email||'')}）を使う人の苗字と名前を入力してください。案件の担当の候補に出ます。</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
        <div class="field"><label>苗字 <span style="color:#c0392b">*</span></label><input id="cl-last" value="${esc(m.lastName||'')}" placeholder="例：山田" style="font-size:16px"/></div>
        <div class="field"><label>名前 <span style="color:#c0392b">*</span></label><input id="cl-first" value="${esc(m.firstName||'')}" placeholder="例：太郎" style="font-size:16px" onkeydown="if(event.key==='Enter'&&!event.isComposing)cloudSaveName()"/></div>
      </div>
      <button class="btn primary" style="width:100%;padding:10px;font-size:14px" onclick="cloudSaveName()">${again?'保存':'登録してはじめる'}</button>
      ${again?'<button class="btn" style="width:100%;margin-top:6px" onclick="hideConnectOverlay()">キャンセル</button>':''}
      <div id="cl-msg" style="font-size:12px;color:#c0392b;margin-top:10px;min-height:16px"></div>`);
    setTimeout(()=>{const e=document.getElementById('cl-last');if(e)e.focus();},50);
  } else if(kind==='login'){
    el.innerHTML=box(`
      <div class="field" style="margin-bottom:10px"><label>メールアドレス</label><input id="cl-email" type="email" autocomplete="username" style="font-size:16px"/></div>
      <div class="field" style="margin-bottom:14px"><label>パスワード</label><input id="cl-pass" type="password" autocomplete="current-password" style="font-size:16px" onkeydown="if(event.key==='Enter')cloudLogin()"/></div>
      <button class="btn primary" style="width:100%;padding:10px;font-size:14px" onclick="cloudLogin()">ログイン</button>
      <div id="cl-msg" style="font-size:12px;color:#c0392b;margin-top:10px;min-height:16px"></div>`);
    setTimeout(()=>{const e=document.getElementById('cl-email');if(e)e.focus();},50);
  } else if(kind==='error'){
    el.innerHTML=box(`<div style="font-size:12.5px;color:#c0392b;line-height:1.7;white-space:pre-line">${esc(text||'')}</div>
      <button class="btn" style="margin-top:14px" onclick="location.reload()">再読み込み</button>`);
  } else {
    el.innerHTML=box(`<div style="font-size:12.5px;color:#666">${esc(text||'読み込み中…')}</div>`);
  }
}

// Init
renderDocBtns();
updateBadge();
renderForm();
setTimeout(()=>{loadIssuer();updateBadge();refreshNoDisplay();setMainTab('proj');initShared();},50);
</script>
